plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - vendor/bundle/**/*

# Requiring MFA changes the owners' RubyGems push policy; decide it separately from gemspec tooling.
Gemspec/RequireMFA:
  Enabled: false

# These specs generate one example per fixture, locale file or documented example; the loop values are the test data.
RSpec/LeakyLocalVariable:
  Exclude:
    - spec/numbers_and_words/documentation_spec.rb
    - spec/numbers_and_words/i18n_spec.rb
    - spec/shared_examples/correct_fixture_examples.rb

# The per-locale CLDR rule set mapping is data, not logic.
Metrics/ModuleLength:
  Exclude:
    - spec/support/cldr_comparison.rb

Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true

Layout/LineLength:
  Enabled: false

Layout/SpaceAroundMethodCallOperator:
  Enabled: true

Lint/DeprecatedOpenSSLConstant:
  Enabled: true

Lint/MixedRegexpCaptureTypes:
  Enabled: true

Lint/RaiseException:
  Enabled: true

Lint/StructNewOverride:
  Enabled: true

Naming/FileName:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

Style/AsciiComments:
  Enabled: false

Style/Documentation:
  Enabled: false
