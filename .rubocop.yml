plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-prose
  - rubocop-rake
  - rubocop-rspec
  - rubocop-yaml

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  Exclude:
    - vendor/bundle/**/*

# Requiring MFA changes the owners' RubyGems push policy; decide it separately from gemspec tooling.
Gemspec/RequireMFA:
  Enabled: false

# These specs generate one example per fixture, locale file or documented example; the loop values are the test data.
RSpec/LeakyLocalVariable:
  Exclude:
    - spec/numbers_and_words/documentation_spec.rb
    - spec/numbers_and_words/i18n_spec.rb
    - spec/shared_examples/correct_fixture_examples.rb

# The per-locale CLDR rule set mapping is data, not logic.
Metrics/ModuleLength:
  Exclude:
    - spec/support/cldr_comparison.rb

Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true

Layout/LineLength:
  Enabled: false

Layout/SpaceAroundMethodCallOperator:
  Enabled: true

Lint/DeprecatedOpenSSLConstant:
  Enabled: true

Lint/MixedRegexpCaptureTypes:
  Enabled: true

Lint/RaiseException:
  Enabled: true

Lint/StructNewOverride:
  Enabled: true

Naming/FileName:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

Style/AsciiComments:
  Enabled: false

Style/Documentation:
  Enabled: false

# rubocop-yaml 0.1.0 parses every inspected file as YAML; keep its cops to YAML files.
YAML/Lint/InvalidSyntax:
  Include:
    - '**/*.yml'
    - '**/*.yaml'

YAML/Lint/DuplicateKey:
  Include:
    - '**/*.yml'
    - '**/*.yaml'

# Full sentences and title-case headings, see AGENTS.md.
Prose/SentenceCapitalization:
  Enabled: true
  # Georgian has Mtavruli capitals in Unicode, but sentences don't start with them.
  IgnoredWords:
    - ქართული

Markdown/HeadingCapitalization:
  Enabled: true
  # The gem name, version suffixes, and the README's French headings, which capitalize only their first word.
  IgnoredWords:
    - numbers_and_words
    - alpha
    - à
    - jour
    - requise
    - supportées

Markdown/ListItemCapitalization:
  Enabled: true
  Style: initial_capital

Markdown/ListItemPunctuation:
  Enabled: true
  # Changelog entries end with their attribution links, \([@author](...)\), which the cop reads as unpunctuated.
  Exclude:
    - CHANGELOG.md

Markdown/TableSpacing:
  Style: compact

# The license text is kept verbatim.
Prose/MaxLength:
  Exclude:
    - LICENSE.txt
