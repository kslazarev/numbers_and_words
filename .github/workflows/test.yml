name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.entry.ruby }} / ${{ matrix.entry.os }}${{ matrix.entry.i18n && format(' / i18n {0}', matrix.entry.i18n) || '' }}
    runs-on: ${{ matrix.entry.os }}
    continue-on-error: ${{ matrix.entry.experimental }}
    env:
      I18N_VERSION: ${{ matrix.entry.i18n }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.2', os: ubuntu-latest, experimental: false }
          - { ruby: '3.2', os: ubuntu-latest, experimental: false, i18n: '1.6.0' }
          - { ruby: '3.3', os: ubuntu-latest, experimental: false }
          - { ruby: '3.4', os: ubuntu-latest, experimental: false }
          - { ruby: '4.0', os: ubuntu-latest, experimental: false }
          - { ruby: 'jruby-10.1.3.0', os: ubuntu-latest, experimental: false }
          - { ruby: '4.0', os: macos-latest, experimental: false }
          - { ruby: '4.0', os: windows-latest, experimental: false }
          - { ruby: head, os: ubuntu-latest, experimental: true }
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Run Tests
        run: bundle exec rake spec
      - name: Smoke-Test Benchmarks
        if: matrix.entry.ruby == '4.0' && matrix.entry.os == 'ubuntu-latest'
        env:
          BENCHMARK_TIME: '0.1'
          BENCHMARK_WARMUP: '0.1'
          BENCHMARK_ITERATIONS: '10'
        run: bundle exec rake benchmark
