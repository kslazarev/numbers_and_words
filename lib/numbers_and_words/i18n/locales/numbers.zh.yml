    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # Numbers are grouped by 10,000, with 零 for each gap ("一千零一", "一亿零五万零三") and before a group below 1,000
    # after a scale word; a number starting with 10 to 19 starts with 十 ("十五", "十万"), here up to 10**120.
    rules:
      cardinal:
        0: '{ones}'
        10: '{ten}[{>}]'
        20: '{ones}{ten}[{>}]'
        100: '{ones}{hundred}[{>after-hundred}]'
        1000: '{ones}{thousand}[{>after-thousand}]'
        10000: '{<cardinal}{scale_4}[{>after-4}]'
        100000000: '{<cardinal}{scale_8}[{>after-8}]'
        1000000000000: '{<cardinal}{scale_12}[{>after-12}]'
        10000000000000000: '{<cardinal}{scale_16}[{>after-16}]'
        100000000000000000000: '{<cardinal}{scale_20}[{>after-20}]'
        1000000000000000000000000: '{<cardinal}{scale_24}[{>after-24}]'
        10000000000000000000000000000: '{<cardinal}{scale_28}[{>after-28}]'
        100000000000000000000000000000000: '{<cardinal}{scale_32}[{>after-32}]'
        1000000000000000000000000000000000000: '{<cardinal}{scale_36}[{>after-36}]'
        10000000000000000000000000000000000000000: '{<cardinal}{scale_40}[{>after-40}]'
        100000000000000000000000000000000000000000000: '{<cardinal}{scale_44}[{>after-44}]'
        1000000000000000000000000000000000000000000000000: '{<cardinal}{scale_48}[{>after-48}]'
