zh:
  numbers:
    supported_options:
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
    minus: 负
    ones: [零, 一, 二, 三, 四, 五, 六, 七, 八, 九]
    ten: 十
    hundred: 百
    thousand: 千
    ten_thousand: 万
    hundred_million: 亿
    # Rule sets for a group of four digits (see NumbersAndWords::Rules), with 零 for a gap inside it ("一千零一"); a
    # number starting with 10 to 19 starts with 十 ("十五"). Languages::Zh joins the groups with ten_thousand and hundred_million.
    # Numbers are written without spaces between words.
    word_separator: ''
    # How decimals are read (see Decorators.readings).
    decimals: {reading: myriad}
    rules:
      cardinal:
        0: '{ones}'
        10: '{ten}[{>}]'
        20: '{ones}{ten}[{>}]'
        100: '{ones}{hundred}[{>after-hundred}]'
        1000: '{ones}{thousand}[{>after-thousand}]'
      # A group after the first one ("一十五").
      group:
        extends: cardinal
        10: '{ones}{ten}[{>}]'
      after-hundred:
        1: '{zero}{ones}'
        10: '{=group}'
      after-thousand:
        1: '{zero}{=group}'
        100: '{=group}'
    zero: 零
    ordinal_prefix: 第
    micro_separator: 点
