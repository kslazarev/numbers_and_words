cs:
  numbers:
    # The plural category of a count (see NumbersAndWords::I18n::PluralRule); any other count is other.
    plural:
      one: 'n % 10 = 1 and n % 100 != 11'
      few: 'n % 10 = 2,3,4 and n % 100 != 12,13,14'
      many: 'n % 10 = 0 or n % 10 = 5,6,7,8,9 or n % 100 = 11,12,13,14'
    supported_options:
      gender: {values: [male, female, neuter], default: counting}
      ordinal: {minimum: 0, maximum: 9999}
      remove_zero: true
    minus: mínus
    ones:
      male: [nula, jeden, dva, tři, čtyři, pět, šest, sedm, osm, devět]
      female: [nula, jedna, dvě, tři, čtyři, pět, šest, sedm, osm, devět]
      neuter: [nula, jedno, dvě, tři, čtyři, pět, šest, sedm, osm, devět]
      counting: [nula, jedna, dva, tři, čtyři, pět, šest, sedm, osm, devět]
    teens: [_, jedenáct, dvanáct, třináct, čtrnáct, patnáct, šestnáct, sedmnáct, osmnáct, devatenáct]
    tens: [_, deset, dvacet, třicet, čtyřicet, padesát, šedesát, sedmdesát, osmdesát, devadesát]
    hundreds: [_, sto, dvě stě, tři sta, čtyři sta, pět set, šest set, sedm set, osm set, devět set]
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # The last group takes the gender asked for, a thousand and a milion the masculine, and a miliarda and the other
    # scale words in -arda the feminine ("dvě miliardy").
    # How decimals are read (see Decorators.readings) and the genders of their parts (see RuleSets#decimal_gender).
    decimals: {reading: counted_fraction, integral_gender: female, fractional_gender: female}
    rules:
      cardinal-male:
        0: '{ones.male}'
        10: '{tens}'
        11: '{teens%}'
        20: '{tens}[ {>}]'
        100: '{hundreds}[ {>}]'
        1000: '{<thousands-count} {thousands}[ {>}]'
        1000000: '{<cardinal-male} {millions}[ {>}]'
        1000000000: '{<cardinal-female} {billions}[ {>}]'
        1000000000000: '{<cardinal-male} {trillions}[ {>}]'
        1000000000000000: '{<cardinal-female} {quadrillions}[ {>}]'
        1000000000000000000: '{<cardinal-male} {quintillion}[ {>}]'
        1000000000000000000000: '{<cardinal-female} {sextillions}[ {>}]'
        1000000000000000000000000: '{<cardinal-male} {septillions}[ {>}]'
        1000000000000000000000000000: '{<cardinal-female} {octillions}[ {>}]'
      cardinal-female:
        extends: cardinal-male
        0: '{ones.female}'
      cardinal-neuter:
        extends: cardinal-male
        0: '{ones.neuter}'
      cardinal-counting:
        extends: cardinal-male
        0: '{ones.counting}'
      # One is left out before tisíc ("tisíc", "dva tisíce"), and kept before the other scale words ("jeden milion").
      thousands-count:
        extends: cardinal-male
        then: cardinal-male
        1: ''
        2: '{ones.male}'
      ordinal:
        0: '{ordinals.ones}'
        10: '{ordinals.tens}'
        11: '{ordinals.teens%}'
        20: '{ordinals.tens}[ {>}]'
        100: '{ordinals.hundreds}[ {>}]'
        1000: '{ordinals.thousands}[ {>}]'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillion, sextillions, septillions, octillions]
    thousands:
      one: tisíc
      few: tisíce
      many: tisíc
    millions:
      one: milion
      few: miliony
      many: milionů
    billions:
      one: miliarda
      few: miliardy
      many: miliard
    trillions:
      one: bilion
      few: biliony
      many: bilionů
    quadrillions:
      one: biliarda
      few: biliardy
      many: biliard
    quintillion:
      one: trilion
      few: triliony
      many: trilionů
    sextillions:
      one: triliarda
      few: triliardy
      many: triliard
    septillions:
      one: kvadrilion
      few: kvadriliony
      many: kvadrilionů
    octillions:
      one: kvadriliarda
      few: kvadriliardy
      many: kvadriliard
    ordinals:
      ones: [nultý, první, druhý, třetí, čtvrtý, pátý, šestý, sedmý, osmý, devátý]
      teens: [_, jedenáctý, dvanáctý, třináctý, čtrnáctý, patnáctý, šestnáctý, sedmnáctý, osmnáctý, devatenáctý]
      tens: [_, desátý, dvacátý, třicátý, čtyřicátý, padesátý, šedesátý, sedmdesátý, osmdesátý, devadesátý]
      hundreds: [_, stý, dvoustý, třístý, čtyřstý, pětistý, šestistý, sedmistý, osmistý, devítistý]
      thousands: [_, tisící, dvoutisící, třítisící, čtyřtisící, pětitisící, šestitisící, sedmitisící, osmitisící, devítitisící]
    # The feminine and neuter ordinals; counting numbers take the feminine ones ("dvacátá první").
    genders:
      female:
        ordinals:
          ones: [nultá, první, druhá, třetí, čtvrtá, pátá, šestá, sedmá, osmá, devátá]
          teens: [_, jedenáctá, dvanáctá, třináctá, čtrnáctá, patnáctá, šestnáctá, sedmnáctá, osmnáctá, devatenáctá]
          tens: [_, desátá, dvacátá, třicátá, čtyřicátá, padesátá, šedesátá, sedmdesátá, osmdesátá, devadesátá]
          hundreds: [_, stá, dvoustá, třístá, čtyřstá, pětistá, šestistá, sedmistá, osmistá, devítistá]
      neuter:
        ordinals:
          ones: [nulté, první, druhé, třetí, čtvrté, páté, šesté, sedmé, osmé, deváté]
          teens: [_, jedenácté, dvanácté, třinácté, čtrnácté, patnácté, šestnácté, sedmnácté, osmnácté, devatenácté]
          tens: [_, desáté, dvacáté, třicáté, čtyřicáté, padesáté, šedesáté, sedmdesáté, osmdesáté, devadesáté]
          hundreds: [_, sté, dvousté, třísté, čtyřsté, pětisté, šestisté, sedmisté, osmisté, devítisté]
    integral:
      zero: celá
      one: celá
      few: celé
      many: celých
      other: celých
    micro: [_, tenths, hundredths, thousandths, millionths, billionths, trillionths, quadrillionths, quintillionths, sextillionths]
    tenths:
      one: desetina
      few: desetiny
      many: desetin
    hundredths:
      one: setina
      few: setiny
      many: setin
    thousandths:
      one: tisícina
      few: tisíciny
      many: tisícin
    millionths:
      one: miliontina
      few: miliontiny
      many: miliontin
    billionths:
      one: miliardtina
      few: miliardtiny
      many: miliardtin
    trillionths:
      one: biliontina
      few: biliontiny
      many: biliontin
    quadrillionths:
      one: biliardtina
      few: biliardtiny
      many: biliardtin
    quintillionths:
      one: triliontina
      few: triliontiny
      many: triliontin
    sextillionths:
      one: triliardtina
      few: triliardtiny
      many: triliardtin
    micro_separator: ''
    micro_prefix:
      tens: deseti
      hundreds: sto
      union: ''
    union: ''
