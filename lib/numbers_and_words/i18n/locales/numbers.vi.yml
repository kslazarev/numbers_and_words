vi:
  numbers:
    supported_options:
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
    minus: âm
    ones: ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín']
    teens: [_, 'mười một', 'mười hai', 'mười ba', 'mười bốn', 'mười lăm', 'mười sáu', 'mười bảy', 'mười tám', 'mười chín']
    tens: [_, 'mười', 'hai mươi', 'ba mươi', 'bốn mươi', 'năm mươi', 'sáu mươi', 'bảy mươi', 'tám mươi', 'chín mươi']
    hundreds: 'trăm'
    zero_hundreds: không trăm
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # A group after a scale word is read in full ("một nghìn không trăm linh một"), and numbers from a billion on
    # count tỷ ("một nghìn không trăm linh một tỷ"); a final one or five after a ten is "mốt" or "lăm".
    # How decimals are read (see Decorators.readings).
    decimals: {reading: plain}
    rules:
      cardinal:
        0: '{ones}'
        10: '{tens}'
        11: '{teens%}'
        20: '{tens}[ {>after-ten}]'
        100: '{ones} {hundreds}[ {>after-hundred}]'
        1000: '{<cardinal} {thousands}[ {>padded}]'
        1000000: '{<cardinal} {millions}[ {>padded-cardinal}]'
        1000000000: '{<cardinal} {billions}[ {>padded-cardinal}]'
      after-ten:
        1: '{units.tens.one}'
        2: '{ones}'
        5: '{units.tens.five}'
        6: '{ones}'
      after-hundred:
        1: '{ones_union} {ones}'
        10: '{=cardinal}'
      padded:
        1: '{zero_hundreds} {=after-hundred}'
        100: '{ones} {hundreds}[ {>after-hundred}]'
      padded-cardinal:
        extends: padded
        1000: '{<padded} {thousands}[ {>padded}]'
        1000000: '{<padded} {millions}[ {>padded-cardinal}]'
      # An ordinal is thứ and the cardinal, with "nhất" for one and "tư" for four.
      ordinal:
        0: '{ordinals.prefix} {=cardinal}'
        1: '{ordinals.prefix} {ordinals.first}'
        2: '{ordinals.prefix} {=cardinal}'
        4: '{ordinals.prefix} {ordinals.fourth}'
        5: '{ordinals.prefix} {=cardinal}'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousands: 'nghìn'
    millions: 'triệu'
    billions: 'tỷ'
    trillions: 'nghìn tỷ'
    quadrillions: 'triệu tỷ'
    quintillions: 'tỷ tỷ'
    sextillions: 'nghìn tỷ tỷ'
    septillions: 'triệu tỷ tỷ'
    octillions: 'tỷ tỷ tỷ'
    nonillions: 'nghìn tỷ tỷ tỷ'
    decillions: 'triệu tỷ tỷ tỷ'
    units:
      tens:
        one: 'mốt'
        five: 'lăm'
    ones_union: 'linh'
    micro_separator: 'phẩy'
    ordinals:
      'prefix': 'thứ'
      'first': 'nhất'
      'fourth': 'tư'
