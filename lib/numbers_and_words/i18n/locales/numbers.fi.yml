fi:
  numbers:
    supported_options:
      ordinal: true
      remove_zero: {keeps_ordinal_zero: true, keeps_micro_separator: true}
    minus: miinus
    ones: [nolla, yksi, kaksi, kolme, neljä, viisi, kuusi, seitsemän, kahdeksan, yhdeksän]
    ten: kymmenen
    teens: toista
    tens: kymmentä
    hundred: sata
    hundreds: sataa
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # Below a million a number is one word ("kaksituhattaviisisataa"); millions and larger are separate words.
    # How decimals are read (see Decorators.readings).
    decimals: {reading: digits}
    rules:
      cardinal:
        0: '{ones}'
        10: '{ten}'
        11: '{ones%}{teens}'
        20: '{ones}{tens}[{>}]'
        100: '{hundred}[{>}]'
        200: '{ones}{hundreds}[{>}]'
        1000: '{thousand}[{>}]'
        2000: '{<cardinal}{thousands}[{>}]'
        1000000: '{million}[ {>}]'
        2000000: '{<cardinal} {millions}[ {>}]'
        1000000000: '{billion}[ {>}]'
        2000000000: '{<cardinal} {billions}[ {>}]'
        1000000000000: '{trillion}[ {>}]'
        2000000000000: '{<cardinal} {trillions}[ {>}]'
        1000000000000000000: '{quintillion}[ {>}]'
        2000000000000000000: '{<cardinal} {quintillions}[ {>}]'
        1000000000000000000000000: '{septillion}[ {>}]'
        2000000000000000000000000: '{<cardinal} {septillions}[ {>}]'
        1000000000000000000000000000000: '{nonillion}[ {>}]'
        2000000000000000000000000000000: '{<cardinal} {nonillions}[ {>}]'
      # Every part of an ordinal is ordinal; the ones are "ensimmäinen" and "toinen" only at the end
      # ("kahdeskymmenesensimmäinen", "kahdestuhannes").
      ordinal:
        0: '{ordinals.ones}'
        10: '{ordinals.ten}'
        11: '{ordinals.multipliers%}{teens}'
        20: '{ordinals.multipliers}{ordinals.tens}[{>}]'
        100: '{ordinals.hundred}[{>}]'
        200: '{ordinals.multipliers}{ordinals.hundred}[{>}]'
        1000: '{ordinals.thousand}[{>}]'
        2000: '{<ordinal-count}{ordinals.thousand}[{>}]'
        1000000: '{ordinals.million}[ {>}]'
        2000000: '{<ordinal-count} {ordinals.million}[ {>}]'
        1000000000: '{ordinals.billion}[ {>}]'
        2000000000: '{<ordinal-count} {ordinals.billion}[ {>}]'
        1000000000000: '{ordinals.trillion}[ {>}]'
        2000000000000: '{<ordinal-count} {ordinals.trillion}[ {>}]'
        1000000000000000000: '{ordinals.quintillion}[ {>}]'
        2000000000000000000: '{<ordinal-count} {ordinals.quintillion}[ {>}]'
        1000000000000000000000000: '{ordinals.septillion}[ {>}]'
        2000000000000000000000000: '{<ordinal-count} {ordinals.septillion}[ {>}]'
        1000000000000000000000000000000: '{ordinals.nonillion}[ {>}]'
        2000000000000000000000000000000: '{<ordinal-count} {ordinals.nonillion}[ {>}]'
      ordinal-count:
        extends: ordinal
        0: '{ordinals.multipliers}'
    # Biljoona and the larger scale words count up to 999 999 times: 10**15 is tuhat biljoonaa, the recommended
    # reading, not the rare biljardi, and so on for triljardi and the other -jardi words (see docs/languages/fi.md).
    mega: [_, tuhat, miljoona, miljardi, biljoona, tuhat biljoonaa, triljoona, tuhat triljoonaa, kvadriljoona, tuhat kvadriljoonaa, kvintiljoona, tuhat kvintiljoonaa]
    thousand: tuhat
    thousands: tuhatta
    million: miljoona
    millions: miljoonaa
    billion: miljardi
    billions: miljardia
    trillion: biljoona
    trillions: biljoonaa
    quintillion: triljoona
    quintillions: triljoonaa
    septillion: kvadriljoona
    septillions: kvadriljoonaa
    nonillion: kvintiljoona
    nonillions: kvintiljoonaa
    micro_separator: pilkku
    ordinals:
      ones: [nollas, ensimmäinen, toinen, kolmas, neljäs, viides, kuudes, seitsemäs, kahdeksas, yhdeksäs]
      multipliers: [_, yhdes, kahdes, kolmas, neljäs, viides, kuudes, seitsemäs, kahdeksas, yhdeksäs]
      ten: kymmenes
      tens: kymmenes
      hundred: sadas
      thousand: tuhannes
      million: miljoonas
      billion: miljardis
      trillion: biljoonas
      quintillion: triljoonas
      septillion: kvadriljoonas
      nonillion: kvintiljoonas
    subunit_separator: ja
