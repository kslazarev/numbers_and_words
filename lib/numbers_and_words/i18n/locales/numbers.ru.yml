      instrumental:
        ones:
          male: [нулем, одним, двумя, тремя, четырьмя, пятью, шестью, семью, восемью, девятью]
          female: [нулем, одной, двумя, тремя, четырьмя, пятью, шестью, семью, восемью, девятью]
          neuter: [нулем, одним, двумя, тремя, четырьмя, пятью, шестью, семью, восемью, девятью]
        teens: [_, одиннадцатью, двенадцатью, тринадцатью, четырнадцатью, пятнадцатью, шестнадцатью, семнадцатью, восемнадцатью, девятнадцатью]
        tens: [_, десятью, двадцатью, тридцатью, сорока, пятьюдесятью, шестьюдесятью, семьюдесятью, восемьюдесятью, девяноста]
        hundreds: [_, ста, двумястами, тремястами, четырьмястами, пятьюстами, шестьюстами, семьюстами, восемьюстами, девятьюстами]
