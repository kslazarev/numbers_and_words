ru:
  numbers:
    supported_options:
      animate: true
      case: {values: [nominative, genitive, dative, accusative, instrumental, prepositional]}
      gender: {values: [male, female, neuter], default: male}
      ordinal: true
      remove_zero: {keeps_ordinal_zero: true}
    minus: минус
    ones:
      male: [ноль, один, два, три, четыре, пять, шесть, семь, восемь, девять]
      female: [ноль, одна, две, три, четыре, пять, шесть, семь, восемь, девять]
      neuter: [ноль, одно, два, три, четыре, пять, шесть, семь, восемь, девять]
    teens: [_, одиннадцать, двенадцать, тринадцать, четырнадцать, пятнадцать, шестнадцать, семнадцать, восемнадцать, девятнадцать]
    tens: [_, десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят, восемьдесят, девяносто]
    hundreds: [_, сто, двести, триста, четыреста, пятьсот, шестьсот, семьсот, восемьсот, девятьсот]
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # The gender of the parts of a decimal (see RuleSets#decimal_gender).
    decimals: {integral_gender: female, fractional_gender: female}
    rules:
      cardinal-male:
        0: '{ones.male}'
        10: '{tens}'
        11: '{teens%}'
        20: '{tens}[ {>}]'
        100: '{hundreds}[ {>}]'
        1000: '{<cardinal-female} {thousands}[ {>}]'
        1000000: '{<cardinal-male} {millions}[ {>}]'
        1000000000: '{<cardinal-male} {billions}[ {>}]'
        1000000000000: '{<cardinal-male} {trillions}[ {>}]'
        1000000000000000: '{<cardinal-male} {quadrillions}[ {>}]'
        1000000000000000000: '{<cardinal-male} {quintillions}[ {>}]'
        1000000000000000000000: '{<cardinal-male} {sextillions}[ {>}]'
        1000000000000000000000000: '{<cardinal-male} {septillions}[ {>}]'
        1000000000000000000000000000: '{<cardinal-male} {octillions}[ {>}]'
        1000000000000000000000000000000: '{<cardinal-male} {nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<cardinal-male} {decillions}[ {>}]'
      cardinal-female:
        extends: cardinal-male
        0: '{ones.female}'
      cardinal-neuter:
        extends: cardinal-male
        0: '{ones.neuter}'
      # The animate accusative: a final "один" and a lone "два", "три" or "четыре" take the genitive ("вижу двадцать
      # одного", "вижу двух"), while compounds ending in two to four keep the nominative ("вижу двадцать два").
      cardinal-male-animate:
        extends: cardinal-male
        then: final-one-animate
        1: одного
        2: двух
        3: трех
        4: четырех
        5: '{ones.male}'
      final-one-animate:
        extends: cardinal-male
        1: одного
        2: '{ones.male}'
      cardinal-female-animate:
        extends: cardinal-female
        then: cardinal-female
        2: двух
        3: трех
        4: четырех
        5: '{ones.female}'
      cardinal-neuter-animate:
        extends: cardinal-neuter
        then: cardinal-neuter
        2: двух
        3: трех
        4: четырех
        5: '{ones.neuter}'
      # Ordinals, in the masculine nominative: only the last word is ordinal ("двадцать первый"), a scale group of
      # exactly one omits that one ("тысяча первый"), and a round scale word joins its multiplier ("двухтысячный").
      ordinal:
        0: '{ordinals.ones}'
        10: '{ordinals.tens}'
        11: '{ordinals.teens%}'
        20: '[{tens} {>}|{ordinals.tens}]'
        100: '[{hundreds} {>}|{ordinals.hundreds}]'
        1000: '[{<scale-count-female} {thousands} {>}|{<combining}тысячный]'
        1000000: '[{<scale-count} {millions} {>}|{<combining}миллионный]'
        1000000000: '[{<scale-count} {billions} {>}|{<combining}миллиардный]'
        1000000000000: '[{<scale-count} {trillions} {>}|{<combining}триллионный]'
        1000000000000000: '[{<scale-count} {quadrillions} {>}|{<combining}квадриллионный]'
        1000000000000000000: '[{<scale-count} {quintillions} {>}|{<combining}квинтиллионный]'
        1000000000000000000000: '[{<scale-count} {sextillions} {>}|{<combining}секстиллионный]'
        1000000000000000000000000: '[{<scale-count} {septillions} {>}|{<combining}септиллионный]'
        1000000000000000000000000000: '[{<scale-count} {octillions} {>}|{<combining}октиллионный]'
        1000000000000000000000000000000: '[{<scale-count} {nonillions} {>}|{<combining}нониллионный]'
        1000000000000000000000000000000000: '[{<scale-count} {decillions} {>}|{<combining}дециллионный]'
      scale-count:
        extends: cardinal-male
        then: cardinal-male
        1: ''
        2: '{ones.male}'
      scale-count-female:
        extends: cardinal-female
        then: cardinal-female
        1: ''
        2: '{ones.female}'
      combining:
        then: combining-rest
        1: ''
        2: '{ordinals.combining_ones}'
        10: '{ordinals.combining_tens}'
        11: '{ordinals.combining_teens%}'
        20: '{ordinals.combining_tens}[{>}]'
        100: '{ordinals.combining_hundreds}[{>}]'
      combining-rest:
        extends: combining
        1: '{ordinals.combining_ones}'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousands:
      one: тысяча
      few: тысячи
      many: тысяч
    millions:
      one: миллион
      few: миллиона
      many: миллионов
    billions:
      one: миллиард
      few: миллиарда
      many: миллиардов
    trillions:
      one: триллион
      few: триллиона
      many: триллионов
    quadrillions:
      one: квадриллион
      few: квадриллиона
      many: квадриллионов
    quintillions:
      one: квинтиллион
      few: квинтиллиона
      many: квинтиллионов
    sextillions:
      one: секстиллион
      few: секстиллиона
      many: секстиллионов
    septillions:
      one: септиллион
      few: септиллиона
      many: септиллионов
    octillions:
      one: октиллион
      few: октиллиона
      many: октиллионов
    nonillions:
      one: нониллион
      few: нониллиона
      many: нониллионов
    decillions:
      one: дециллион
      few: дециллиона
      many: дециллионов
    integral:
      one: целая
      few: целых
      many: целых
    micro: [_, tenths, hundredths, thousandths, millionths, billionths, trillionths, quadrillionths, quintillionths, sextillionths]
    tenths:
      one: десятая
      few: десятых
      many: десятых
    hundredths:
      one: сотая
      few: сотых
      many: сотых
    thousandths:
      one: тысячная
      few: тысячных
      many: тысячных
    millionths:
      one: миллионная
      few: миллионных
      many: миллионных
    billionths:
      one: миллиардная
      few: миллиардных
      many: миллиардных
    trillionths:
      one: триллионная
      few: триллионных
      many: триллионных
    quadrillionths:
      one: квадриллионная
      few: квадриллионных
      many: квадриллионных
    quintillionths:
      one: квинтиллионная
      few: квинтиллионных
      many: квинтиллионных
    sextillionths:
      one: секстиллионная
      few: секстиллионных
      many: секстиллионных
    micro_separator: 'и'
    micro_prefix:
      tens: десяти
      hundreds: сто
      union: ''
    union: 'и'
    # Words in the other cases, where they differ from the nominative ones above; a scale word is in the singular
    # after a count ending in one ("двадцати одной тысячи") and in the plural otherwise ("двух тысяч").
    cases:
      genitive:
        ones:
          male: [нуля, одного, двух, трех, четырех, пяти, шести, семи, восьми, девяти]
          female: [нуля, одной, двух, трех, четырех, пяти, шести, семи, восьми, девяти]
          neuter: [нуля, одного, двух, трех, четырех, пяти, шести, семи, восьми, девяти]
        teens: [_, одиннадцати, двенадцати, тринадцати, четырнадцати, пятнадцати, шестнадцати, семнадцати, восемнадцати, девятнадцати]
        tens: [_, десяти, двадцати, тридцати, сорока, пятидесяти, шестидесяти, семидесяти, восьмидесяти, девяноста]
        hundreds: [_, ста, двухсот, трехсот, четырехсот, пятисот, шестисот, семисот, восьмисот, девятисот]
        thousands: {one: тысячи, few: тысяч, many: тысяч}
