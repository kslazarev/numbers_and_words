        septillions: {one: септиллиону, few: септиллионам, many: септиллионам}
        octillions: {one: октиллиону, few: октиллионам, many: октиллионам}
        nonillions: {one: нониллиону, few: нониллионам, many: нониллионам}
        decillions: {one: дециллиону, few: дециллионам, many: дециллионам}
      accusative:
        ones:
          female: [ноль, одну, две, три, четыре, пять, шесть, семь, восемь, девять]
