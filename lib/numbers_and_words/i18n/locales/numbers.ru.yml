      dative:
        ones:
          male: [нулю, одному, двум, трем, четырем, пяти, шести, семи, восьми, девяти]
          female: [нулю, одной, двум, трем, четырем, пяти, шести, семи, восьми, девяти]
          neuter: [нулю, одному, двум, трем, четырем, пяти, шести, семи, восьми, девяти]
        teens: [_, одиннадцати, двенадцати, тринадцати, четырнадцати, пятнадцати, шестнадцати, семнадцати, восемнадцати, девятнадцати]
        tens: [_, десяти, двадцати, тридцати, сорока, пятидесяти, шестидесяти, семидесяти, восьмидесяти, девяноста]
        hundreds: [_, ста, двумстам, тремстам, четыремстам, пятистам, шестистам, семистам, восьмистам, девятистам]
        thousands: {one: тысяче, few: тысячам, many: тысячам}
        millions: {one: миллиону, few: миллионам, many: миллионам}
        billions: {one: миллиарду, few: миллиардам, many: миллиардам}
        trillions: {one: триллиону, few: триллионам, many: триллионам}
        quadrillions: {one: квадриллиону, few: квадриллионам, many: квадриллионам}
