ka:
  numbers:
    supported_options:
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
    minus: მინუს
    # How decimals are read (see Decorators.readings), after micro_separator.
    decimals: {reading: digits}
    micro_separator: მძიმე
    ones: [ნული, ერთი, ორი, სამი, ოთხი, ხუთი, ექვსი, შვიდი, რვა, ცხრა]
    teens: [_, თერთმეტი, თორმეტი, ცამეტი, თოთხმეტი, თხუთმეტი, თექვსმეტი, ჩვიდმეტი, თვრამეტი, ცხრამეტი]
    tens: [_, ათი, ოცი, ოცდაათი, ორმოცი, ორმოცდაათი, სამოცი, სამოცდაათი, ოთხმოცი, ოთხმოცდაათი]
    hundreds: ასი
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # Tens are counted in twenties ("ოცდაერთი", "ორმოცდაათი"), and the hundreds and scale words take their partial
    # form before other words ("ას ერთი", "ათას ერთი").
    rules:
      cardinal:
        0: '{ones}'
        10: '{tens}'
        11: '{teens%}'
        20: '[{partials.twenty}{>}|{tens}]'
        30: '[{partials.twenty}{teens%}|{tens}]'
        40: '[{partials.forty}{>}|{tens}]'
        50: '[{partials.forty}{teens%}|{tens}]'
        60: '[{partials.sixty}{>}|{tens}]'
        70: '[{partials.sixty}{teens%}|{tens}]'
        80: '[{partials.eighty}{>}|{tens}]'
        90: '[{partials.eighty}{teens%}|{tens}]'
        100: '[{partials.hundreds} {>}|{hundreds}]'
        200: '[{partials.ones}{partials.hundreds} {>}|{partials.ones}{hundreds}]'
        1000: '[{partials.thousands} {>}|{thousands}]'
        2000: '[{<cardinal} {partials.thousands} {>}|{<cardinal} {thousands}]'
        1000000: '[{<cardinal} {partials.millions} {>}|{<cardinal} {millions}]'
        1000000000: '[{<cardinal} {partials.billions} {>}|{<cardinal} {billions}]'
        1000000000000: '[{<cardinal} {partials.trillions} {>}|{<cardinal} {trillions}]'
        1000000000000000: '[{<cardinal} {partials.quadrillions} {>}|{<cardinal} {quadrillions}]'
        1000000000000000000: '[{<cardinal} {partials.quintillions} {>}|{<cardinal} {quintillions}]'
        1000000000000000000000: '[{<cardinal} {partials.sextillions} {>}|{<cardinal} {sextillions}]'
        1000000000000000000000000: '[{<cardinal} {partials.septillions} {>}|{<cardinal} {septillions}]'
        1000000000000000000000000000: '[{<cardinal} {partials.octillions} {>}|{<cardinal} {octillions}]'
        1000000000000000000000000000000: '[{<cardinal} {partials.nonillions} {>}|{<cardinal} {nonillions}]'
        1000000000000000000000000000000000: '[{<cardinal} {partials.decillions} {>}|{<cardinal} {decillions}]'
      # An ordinal puts მე- and -ე around its last word, or the last part of a compound ("ოცდამეერთე"); one is
      # "პირველი" alone, and a leading one before a single scale word is left out ("მემილიონე").
      ordinal:
        then: ordinal-inner
        0: '{ordinals.ones}'
        1: '{ordinals.first}'
        2: '{ordinals.ones}'
        10: '{ordinals.tens}'
        11: '{ordinals.teens%}'
        20: '[{partials.twenty}{ordinals.ones%}|{ordinals.tens}]'
        30: '[{partials.twenty}{ordinals.teens%}|{ordinals.tens}]'
        40: '[{partials.forty}{ordinals.ones%}|{ordinals.tens}]'
        50: '[{partials.forty}{ordinals.teens%}|{ordinals.tens}]'
        60: '[{partials.sixty}{ordinals.ones%}|{ordinals.tens}]'
        70: '[{partials.sixty}{ordinals.teens%}|{ordinals.tens}]'
        80: '[{partials.eighty}{ordinals.ones%}|{ordinals.tens}]'
        90: '[{partials.eighty}{ordinals.teens%}|{ordinals.tens}]'
        100: '[{partials.hundreds} {>}|{ordinals.hundreds}]'
        200: '[{partials.ones}{partials.hundreds} {>}|{ordinals.hundreds}]'
        1000: '[{partials.thousands} {>}|{ordinals.thousands}]'
        2000: '{<cardinal} {partials.thousands} {>}'
        1000000: '[{<cardinal} {partials.millions} {>}|{ordinals.millions}]'
        1000000000: '[{<cardinal} {partials.billions} {>}|{ordinals.billions}]'
        1000000000000: '[{<cardinal} {partials.trillions} {>}|{ordinals.trillions}]'
        1000000000000000: '[{<cardinal} {partials.quadrillions} {>}|{ordinals.quadrillions}]'
        1000000000000000000: '[{<cardinal} {partials.quintillions} {>}|{ordinals.quintillions}]'
        1000000000000000000000: '[{<cardinal} {partials.sextillions} {>}|{ordinals.sextillions}]'
        1000000000000000000000000: '[{<cardinal} {partials.septillions} {>}|{ordinals.septillions}]'
        1000000000000000000000000000: '[{<cardinal} {partials.octillions} {>}|{ordinals.octillions}]'
        1000000000000000000000000000000: '[{<cardinal} {partials.nonillions} {>}|{ordinals.nonillions}]'
        1000000000000000000000000000000000: '[{<cardinal} {partials.decillions} {>}|{ordinals.decillions}]'
      ordinal-inner:
        extends: ordinal
        1: '{ordinals.ones}'
        1000000: '[{<cardinal} {partials.millions} {>}|{<cardinal} {ordinals.millions}]'
        1000000000: '[{<cardinal} {partials.billions} {>}|{<cardinal} {ordinals.billions}]'
        1000000000000: '[{<cardinal} {partials.trillions} {>}|{<cardinal} {ordinals.trillions}]'
        1000000000000000: '[{<cardinal} {partials.quadrillions} {>}|{<cardinal} {ordinals.quadrillions}]'
        1000000000000000000: '[{<cardinal} {partials.quintillions} {>}|{<cardinal} {ordinals.quintillions}]'
        1000000000000000000000: '[{<cardinal} {partials.sextillions} {>}|{<cardinal} {ordinals.sextillions}]'
        1000000000000000000000000: '[{<cardinal} {partials.septillions} {>}|{<cardinal} {ordinals.septillions}]'
        1000000000000000000000000000: '[{<cardinal} {partials.octillions} {>}|{<cardinal} {ordinals.octillions}]'
        1000000000000000000000000000000: '[{<cardinal} {partials.nonillions} {>}|{<cardinal} {ordinals.nonillions}]'
        1000000000000000000000000000000000: '[{<cardinal} {partials.decillions} {>}|{<cardinal} {ordinals.decillions}]'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousands: ათასი
    millions: მილიონი
    billions: მილიარდი
    trillions: ტრილიონი
    quadrillions: კვადრილიონი
    quintillions: კვინტილიონი
    sextillions: სექსტილიონი
    septillions: სეპტილიონი
    octillions: ოქტილიონი
    nonillions: ნონილიონი
    decillions: დეცილიონი
    partials:
      ones: [ნული, ერთი, ორ, სამ, ოთხ, ხუთ, ექვს, შვიდ, რვა, ცხრა]
      twenty: ოცდა
      forty: ორმოცდა
      sixty: სამოცდა
      eighty: ოთხმოცდა
      hundreds: ას
      thousands: ათას
      millions: მილიონ
      billions: მილიარდ
      trillions: ტრილიონ
      quadrillions: კვადრილიონ
      quintillions: კვინტილიონ
      sextillions: სექსტილიონ
      septillions: სეპტილიონ
      octillions: ოქტილიონ
      nonillions: ნონილიონ
      decillions: დეცილიონ
    ordinals:
      first: პირველი
      ones: [მენულე, მეერთე, მეორე, მესამე, მეოთხე, მეხუთე, მეექვსე, მეშვიდე, მერვე, მეცხრე]
      teens: [_, მეთერთმეტე, მეთორმეტე, მეცამეტე, მეთოთხმეტე, მეთხუთმეტე, მეთექვსმეტე, მეჩვიდმეტე, მეთვრამეტე, მეცხრამეტე]
      tens: [_, მეათე, მეოცე, ოცდამეათე, მეორმოცე, ორმოცდამეათე, მესამოცე, სამოცდამეათე, მეოთხმოცე, ოთხმოცდამეათე]
      # The ordinals of round hundreds, from the cardinal word ("მეორასე").
      hundreds: [_, მეასე, მეორასე, მესამასე, მეოთხასე, მეხუთასე, მეექვსასე, შვიდამესე, მერვაასე, მეცხრაასე]
      thousands: მეათასე
      millions: მემილიონე
      billions: მემილიარდე
      trillions: მეტრილიონე
      quadrillions: მეკვადრილიონე
      quintillions: მეკვინტილიონე
      sextillions: მესექსტილიონე
      septillions: მესეპტილიონე
      octillions: მეოქტილიონე
      nonillions: მენონილიონე
      decillions: მედეცილიონე
    subunit_separator: და
