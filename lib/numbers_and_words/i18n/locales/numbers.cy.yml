cy:
  numbers:
    # Unicode CLDR's plural categories, which are also those of the mutations after a number: un softens a
    # feminine noun, dau and dwy soften any noun, tri and chwe aspirate c, p and t.
    plural:
      zero: n = 0
      one: n = 1
      two: n = 2
      few: n = 3
      many: n = 6
    supported_options:
      gender: {values: [male, female], default: male}
      ordinal: {minimum: 1}
      remove_zero: {keeps_micro_separator: true}
      vigesimal: {rules: vigesimal}
    minus: minws
    # How decimals are read (see Decorators.readings), after micro_separator.
    decimals: {reading: digits}
    micro_separator: pwynt
    ones: [dim, un, dau, tri, pedwar, pump, chwech, saith, wyth, naw]
    ten: deg
    # The decimal tens of Unicode CLDR.
    tens: [_, un deg, dau ddeg, tri deg, pedwar deg, pum deg, chwe deg, saith deg, wyth deg, naw deg]
    hundreds: [_, cant, dau gant, tri chant, pedwar cant, pum cant, chwe chant, saith cant, wyth cant, naw cant]
    # Hundreds before a noun ("can mil", "tri chan mil").
    hundreds_count: [_, can, dau gan, tri chan, pedwar can, pum can, chwe chan, saith can, wyth can, naw can]
    # The counts before a masculine and a feminine noun.
    prefix_m: [_, un, dau, tri, pedwar, pum, chwe, saith, wyth, naw, deg]
    prefix_f: [_, un, dwy, tair, pedair, pum, chwe, saith, wyth, naw, deg]
    # The vigesimal numbers, and the forms after a (ac before a vowel), which aspirates c, p and t.
    twelve: deuddeg
    fifteen: pymtheg
    eighteen: deunaw
    ar_ddeg: ar ddeg
    ar_bymtheg: ar bymtheg
    scores: [_, ar hugain, a deugain, a thrigain, a phedwar ugain]
    score_words: [_, ugain, deugain, trigain, pedwar ugain]
    fifty: hanner cant
    fifty_count: hanner can
    and_ones: [_, ac un, a dau, a thri, a phedwar, a phump, a chwech, a saith, ac wyth, a naw, a deg]
    and_prefix_m: [_, ac un, a dau, a thri, a phedwar, a phum, a chwe, a saith, ac wyth, a naw, a deg]
    and_prefix_f: [_, ac un, a dwy, a thair, a phedair, a phum, a chwe, a saith, ac wyth, a naw, a deg]
    and_twelve: a deuddeg
    and_fifteen: a phymtheg
    and_eighteen: a deunaw
    and_score_words: [_, ac ugain, a deugain, a thrigain, a phedwar ugain]
    and_fifty_count: a hanner can
    and_fifty: a hanner cant
    # The words that an option changes when it is on: gender: :female counts with dwy, tair and pedair.
    options:
      female:
        ones: [dim, un, dwy, tair, pedair, pump, chwech, saith, wyth, naw]
        and_ones: [_, ac un, a dwy, a thair, a phedair, a phump, a chwech, a saith, ac wyth, a naw, a deg]
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # Cardinals follow the decimal system of Unicode CLDR, with the mutations of a noun after a number; vigesimal:
    # true reads the traditional system ("un ar hugain").
    rules:
      cardinal:
        0: '{ones}'
        10: '{ten}'
        11: '{tens} {>}'
        20: '{tens}[ {>}]'
        100: '{hundreds}[ {>}]'
        1000: '{<count-thousands}[ {>}]'
        1000000: '{<count-millions}[ {>}]'
        1000000000: '{<count-billions}[ {>}]'
        1000000000000: '{<count-trillions}[ {>}]'
        1000000000000000: '{<count-quadrillions}[ {>}]'
        1000000000000000000: '{<count-quintillions}[ {>}]'
        1000000000000000000000: '{<count-sextillions}[ {>}]'
        1000000000000000000000000: '{<count-septillions}[ {>}]'
        1000000000000000000000000000: '{<count-octillions}[ {>}]'
        1000000000000000000000000000000: '{<count-nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<count-decillions}[ {>}]'
      cardinal-vigesimal:
        0: '{ones}'
        10: '{ten}'
        11: '{ones%} {ar_ddeg}'
        '12/12': '{twelve}'
        13: '{ones%} {ar_ddeg}'
        '15/15': '{fifteen}'
        '16/15': '{ones%} {ar_bymtheg}'
        '18/18': '{eighteen}'
        '19/15': '{ones%} {ar_bymtheg}'
        '20/20': '[{>} {scores}|{score_words}]'
        '50/20': '{fifty}'
        '51/20': '[{>} {scores}|{score_words}]'
        100: '{hundreds}[ {>vigesimal-and}]'
        1000: '{<vigesimal-count-thousands}[{>vigesimal-rest}]'
        1000000: '{<vigesimal-count-millions}[{>vigesimal-rest}]'
        1000000000: '{<vigesimal-count-billions}[{>vigesimal-rest}]'
        1000000000000: '{<vigesimal-count-trillions}[{>vigesimal-rest}]'
        1000000000000000: '{<vigesimal-count-quadrillions}[{>vigesimal-rest}]'
        1000000000000000000: '{<vigesimal-count-quintillions}[{>vigesimal-rest}]'
        1000000000000000000000: '{<vigesimal-count-sextillions}[{>vigesimal-rest}]'
        1000000000000000000000000: '{<vigesimal-count-septillions}[{>vigesimal-rest}]'
        1000000000000000000000000000: '{<vigesimal-count-octillions}[{>vigesimal-rest}]'
        1000000000000000000000000000000: '{<vigesimal-count-nonillions}[{>vigesimal-rest}]'
        1000000000000000000000000000000000: '{<vigesimal-count-decillions}[{>vigesimal-rest}]'
      # A last part below a hundred after a or ac ("cant ac un", "mil a deg").
      vigesimal-and:
        1: '{and_ones}'
        11: '{and_ones%} {ar_ddeg}'
        '12/12': '{and_twelve}'
        13: '{and_ones%} {ar_ddeg}'
        '15/15': '{and_fifteen}'
        '16/15': '{and_ones%} {ar_bymtheg}'
        '18/18': '{and_eighteen}'
        '19/15': '{and_ones%} {ar_bymtheg}'
        '20/20': '[{>} {scores}|{and_score_words}]'
        '50/20': '{and_fifty}'
        '51/20': '[{>} {scores}|{and_score_words}]'
      vigesimal-rest:
        1: ' {=vigesimal-and}'
        100: ' {=cardinal-vigesimal}'
      # The count of a scale word, and the word mutated by the count's last digit ("dwy fil", "tri thriliwn", "dau
      # filiwn" for two billion).
      count-thousands:
        1: '{thousands%}'
        2: '{prefix_f} {thousands}'
        10: '{ten} {thousands%}'
        11: '{tens} {>unit-thousands}'
        20: '{tens}[ {>unit-thousands}| {thousands%}]'
        100: '[{hundreds} {>rest-thousands}|{hundreds_count} {thousands%}]'
      unit-thousands:
        1: '{prefix_f} {thousands}'
      rest-thousands:
        extends: count-thousands
        1: '{prefix_f} {thousands}'
      count-millions:
        1: '{millions%}'
        2: '{prefix_f} {millions}'
        10: '{ten} {millions%}'
        11: '{tens} {>unit-millions}'
        20: '{tens}[ {>unit-millions}| {millions%}]'
        100: '[{hundreds} {>rest-millions}|{hundreds_count} {millions%}]'
      unit-millions:
        1: '{prefix_f} {millions}'
      rest-millions:
        extends: count-millions
        1: '{prefix_f} {millions}'
      count-billions:
        1: '{billions%}'
        2: '{prefix_m} {billions}'
        10: '{ten} {billions%}'
        11: '{tens} {>unit-billions}'
        20: '{tens}[ {>unit-billions}| {billions%}]'
        100: '[{hundreds} {>rest-billions}|{hundreds_count} {billions%}]'
      unit-billions:
        1: '{prefix_m} {billions}'
      rest-billions:
        extends: count-billions
        1: '{prefix_m} {billions}'
      count-trillions:
        1: '{trillions%}'
        2: '{prefix_m} {trillions}'
        10: '{ten} {trillions%}'
        11: '{tens} {>unit-trillions}'
        20: '{tens}[ {>unit-trillions}| {trillions%}]'
        100: '[{hundreds} {>rest-trillions}|{hundreds_count} {trillions%}]'
      unit-trillions:
        1: '{prefix_m} {trillions}'
      rest-trillions:
        extends: count-trillions
        1: '{prefix_m} {trillions}'
      count-quadrillions:
