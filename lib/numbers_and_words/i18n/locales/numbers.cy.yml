        10: '{ten} {sextillions%}'
        11: '{tens} {>unit-sextillions}'
        20: '{tens}[ {>unit-sextillions}| {sextillions%}]'
        100: '[{hundreds} {>rest-sextillions}|{hundreds_count} {sextillions%}]'
      unit-sextillions:
