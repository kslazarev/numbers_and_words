        10: '{ten} {quintillions%}'
        11: '{tens} {>unit-quintillions}'
        20: '{tens}[ {>unit-quintillions}| {quintillions%}]'
        100: '[{hundreds} {>rest-quintillions}|{hundreds_count} {quintillions%}]'
      unit-quintillions:
        1: '{prefix_m} {quintillions}'
      rest-quintillions:
