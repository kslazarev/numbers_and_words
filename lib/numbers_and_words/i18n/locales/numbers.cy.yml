        2: '{prefix_m} {quadrillions}'
        10: '{ten} {quadrillions%}'
        11: '{tens} {>unit-quadrillions}'
        20: '{tens}[ {>unit-quadrillions}| {quadrillions%}]'
        100: '[{hundreds} {>rest-quadrillions}|{hundreds_count} {quadrillions%}]'
      unit-quadrillions:
