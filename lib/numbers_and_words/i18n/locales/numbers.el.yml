el:
  numbers:
    supported_options:
      gender: {values: [male, female, neuter], default: neuter}
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
    minus: μείον
    ones:
      neuter: [μηδέν, ένα, δύο, τρία, τέσσερα, πέντε, έξι, επτά, οκτώ, εννέα]
      male: [μηδέν, ένας, δύο, τρεις, τέσσερις, πέντε, έξι, επτά, οκτώ, εννέα]
      female: [μηδέν, μία, δύο, τρεις, τέσσερις, πέντε, έξι, επτά, οκτώ, εννέα]
    teens:
      neuter: [δέκα, έντεκα, δώδεκα, δεκατρία, δεκατέσσερα, δεκαπέντε, δεκαέξι, δεκαεπτά, δεκαοκτώ, δεκαεννέα]
      male: [δέκα, έντεκα, δώδεκα, δεκατρείς, δεκατέσσερις, δεκαπέντε, δεκαέξι, δεκαεπτά, δεκαοκτώ, δεκαεννέα]
      female: [δέκα, έντεκα, δώδεκα, δεκατρείς, δεκατέσσερις, δεκαπέντε, δεκαέξι, δεκαεπτά, δεκαοκτώ, δεκαεννέα]
    tens: [_, _, είκοσι, τριάντα, σαράντα, πενήντα, εξήντα, εβδομήντα, ογδόντα, ενενήντα]
    hundreds:
      neuter: [_, εκατό, διακόσια, τριακόσια, τετρακόσια, πεντακόσια, εξακόσια, επτακόσια, οκτακόσια, εννιακόσια]
      male: [_, εκατό, διακόσιοι, τριακόσιοι, τετρακόσιοι, πεντακόσιοι, εξακόσιοι, επτακόσιοι, οκτακόσιοι, εννιακόσιοι]
      female: [_, εκατό, διακόσιες, τριακόσιες, τετρακόσιες, πεντακόσιες, εξακόσιες, επτακόσιες, οκτακόσιες, εννιακόσιες]
    # εκατό becomes εκατόν before the rest of its group: εκατόν ένα.
    hundred_and: εκατόν
    thousand:
      neuter: χίλια
      male: χίλιοι
      female: χίλιες
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # The last group takes the gender asked for, χιλιάδες counts in the feminine and the larger scale words in the
    # neuter; "εκατό" is "εκατόν" before other words.
    # How decimals are read (see Decorators.readings) and the genders of their parts (see RuleSets#decimal_gender).
    decimals: {reading: point_words, fractional_gender: neuter}
    rules:
      cardinal-neuter:
        0: '{ones.neuter}'
        10: '{teens.neuter%}'
        20: '{tens}[ {>}]'
        100: '[{hundred_and} {>}|{hundreds.neuter}]'
        200: '{hundreds.neuter}[ {>}]'
        1000: '{thousand.neuter}[ {>}]'
        2000: '{<cardinal-female} {thousands}[ {>}]'
        1000000: '{<cardinal-neuter} {millions}[ {>}]'
        1000000000: '{<cardinal-neuter} {billions}[ {>}]'
        1000000000000: '{<cardinal-neuter} {trillions}[ {>}]'
        1000000000000000: '{<cardinal-neuter} {quadrillions}[ {>}]'
        1000000000000000000: '{<cardinal-neuter} {quintillions}[ {>}]'
        1000000000000000000000: '{<cardinal-neuter} {sextillions}[ {>}]'
        1000000000000000000000000: '{<cardinal-neuter} {septillions}[ {>}]'
        1000000000000000000000000000: '{<cardinal-neuter} {octillions}[ {>}]'
        1000000000000000000000000000000: '{<cardinal-neuter} {nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<cardinal-neuter} {decillions}[ {>}]'
      cardinal-male:
        0: '{ones.male}'
        10: '{teens.male%}'
        20: '{tens}[ {>}]'
        100: '[{hundred_and} {>}|{hundreds.male}]'
        200: '{hundreds.male}[ {>}]'
        1000: '{thousand.male}[ {>}]'
        2000: '{<cardinal-female} {thousands}[ {>}]'
        1000000: '{<cardinal-neuter} {millions}[ {>}]'
        1000000000: '{<cardinal-neuter} {billions}[ {>}]'
        1000000000000: '{<cardinal-neuter} {trillions}[ {>}]'
        1000000000000000: '{<cardinal-neuter} {quadrillions}[ {>}]'
        1000000000000000000: '{<cardinal-neuter} {quintillions}[ {>}]'
        1000000000000000000000: '{<cardinal-neuter} {sextillions}[ {>}]'
        1000000000000000000000000: '{<cardinal-neuter} {septillions}[ {>}]'
        1000000000000000000000000000: '{<cardinal-neuter} {octillions}[ {>}]'
        1000000000000000000000000000000: '{<cardinal-neuter} {nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<cardinal-neuter} {decillions}[ {>}]'
      cardinal-female:
        0: '{ones.female}'
        10: '{teens.female%}'
        20: '{tens}[ {>}]'
        100: '[{hundred_and} {>}|{hundreds.female}]'
        200: '{hundreds.female}[ {>}]'
        1000: '{thousand.female}[ {>}]'
        2000: '{<cardinal-female} {thousands}[ {>}]'
        1000000: '{<cardinal-neuter} {millions}[ {>}]'
        1000000000: '{<cardinal-neuter} {billions}[ {>}]'
        1000000000000: '{<cardinal-neuter} {trillions}[ {>}]'
        1000000000000000: '{<cardinal-neuter} {quadrillions}[ {>}]'
        1000000000000000000: '{<cardinal-neuter} {quintillions}[ {>}]'
        1000000000000000000000: '{<cardinal-neuter} {sextillions}[ {>}]'
        1000000000000000000000000: '{<cardinal-neuter} {septillions}[ {>}]'
        1000000000000000000000000000: '{<cardinal-neuter} {octillions}[ {>}]'
        1000000000000000000000000000000: '{<cardinal-neuter} {nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<cardinal-neuter} {decillions}[ {>}]'
      # Every part below 10,000 is ordinal ("εκατοστός εικοστός πρώτος"); from ten thousand a count is cardinal and
      # neuter before the ordinal of its scale word ("είκοσι ένα χιλιοστός"), as in Unicode CLDR.
      ordinal:
        0: '{ones.neuter}'
        1: '{ordinals.ones}'
        10: '{ordinals.teens%}'
        13: '{ordinals.tens} {ordinals.ones%}'
        20: '{ordinals.tens}[ {>}]'
        100: '{ordinals.hundreds}[ {>}]'
        1000: '{ordinals.thousands}[ {>}]'
        '10000/1000': '{ordinals.ten_thousand}[ {>}]'
        '11000/1000': '{<cardinal-neuter} {ordinals.thousand}[ {>}]'
        1000000: '{<scale-count} {ordinals.millions}[ {>}]'
        1000000000: '{<scale-count} {ordinals.billions}[ {>}]'
        1000000000000: '{<scale-count} {ordinals.trillions}[ {>}]'
        1000000000000000: '{<scale-count} {ordinals.quadrillions}[ {>}]'
        1000000000000000000: '{<scale-count} {ordinals.quintillions}[ {>}]'
        1000000000000000000000: '{<scale-count} {ordinals.sextillions}[ {>}]'
        1000000000000000000000000: '{<scale-count} {ordinals.septillions}[ {>}]'
        1000000000000000000000000000: '{<scale-count} {ordinals.octillions}[ {>}]'
        1000000000000000000000000000000: '{<scale-count} {ordinals.nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<scale-count} {ordinals.decillions}[ {>}]'
      # A scale ordinal's count is neuter, and a count of one is left out ("εκατομμυριοστός", "δύο εκατομμυριοστός").
      scale-count:
        extends: cardinal-neuter
        then: cardinal-neuter
        1: ''
        2: '{ones.neuter}'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousands: {one: χιλιάδα, other: χιλιάδες}
    millions: {one: εκατομμύριο, other: εκατομμύρια}
    billions: {one: δισεκατομμύριο, other: δισεκατομμύρια}
    trillions: {one: τρισεκατομμύριο, other: τρισεκατομμύρια}
    quadrillions: {one: τετράκις εκατομμύριο, other: τετράκις εκατομμύρια}
    quintillions: {one: πεντάκις εκατομμύριο, other: πεντάκις εκατομμύρια}
    sextillions: {one: εξάκις εκατομμύριο, other: εξάκις εκατομμύρια}
    septillions: {one: επτάκις εκατομμύριο, other: επτάκις εκατομμύρια}
    octillions: {one: οκτάκις εκατομμύριο, other: οκτάκις εκατομμύρια}
    nonillions: {one: εννεάκις εκατομμύριο, other: εννεάκις εκατομμύρια}
    decillions: {one: δεκάκις εκατομμύριο, other: δεκάκις εκατομμύρια}
    ordinals:
      ones: [_, πρώτος, δεύτερος, τρίτος, τέταρτος, πέμπτος, έκτος, έβδομος, όγδοος, ένατος]
      teens: [δέκατος, ενδέκατος, δωδέκατος]
      tens: [_, δέκατος, εικοστός, τριακοστός, τεσσαρακοστός, πεντηκοστός, εξηκοστός, εβδομηκοστός, ογδοηκοστός, ενενηκοστός]
      hundreds: [_, εκατοστός, διακοσιοστός, τριακοσιοστός, τετρακοσιοστός, πεντακοσιοστός, εξακοσιοστός, επτακοσιοστός, οκτακοσιοστός, εννιακοσιοστός]
      thousands: [_, χιλιοστός, δισχιλιοστός, τρισχιλιοστός, τετρακισχιλιοστός, πεντακισχιλιοστός, εξακισχιλιοστός, επτακισχιλιοστός, οκτακισχιλιοστός, εννεακισχιλιοστός]
      thousand: χιλιοστός
      ten_thousand: δεκακισχιλιοστός
      millions: εκατομμυριοστός
      billions: δισεκατομμυριοστός
      trillions: τρισεκατομμυριοστός
      quadrillions: τετράκις εκατομμυριοστός
      quintillions: πεντάκις εκατομμυριοστός
      sextillions: εξάκις εκατομμυριοστός
      septillions: επτάκις εκατομμυριοστός
      octillions: οκτάκις εκατομμυριοστός
      nonillions: εννεάκις εκατομμυριοστός
      decillions: δεκάκις εκατομμυριοστός
    # The feminine and neuter ordinals.
    genders:
      female:
        ordinals:
          ones: [_, πρώτη, δεύτερη, τρίτη, τέταρτη, πέμπτη, έκτη, έβδομη, όγδοη, ένατη]
          teens: [δέκατη, ενδέκατη, δωδέκατη]
          tens: [_, δέκατη, εικοστή, τριακοστή, τεσσαρακοστή, πεντηκοστή, εξηκοστή, εβδομηκοστή, ογδοηκοστή, ενενηκοστή]
          hundreds: [_, εκατοστή, διακοσιοστή, τριακοσιοστή, τετρακοσιοστή, πεντακοσιοστή, εξακοσιοστή, επτακοσιοστή, οκτακοσιοστή, εννιακοσιοστή]
          thousands: [_, χιλιοστή, δισχιλιοστή, τρισχιλιοστή, τετρακισχιλιοστή, πεντακισχιλιοστή, εξακισχιλιοστή, επτακισχιλιοστή, οκτακισχιλιοστή, εννεακισχιλιοστή]
          thousand: χιλιοστή
          ten_thousand: δεκακισχιλιοστή
          millions: εκατομμυριοστή
          billions: δισεκατομμυριοστή
          trillions: τρισεκατομμυριοστή
          quadrillions: τετράκις εκατομμυριοστή
          quintillions: πεντάκις εκατομμυριοστή
          sextillions: εξάκις εκατομμυριοστή
          septillions: επτάκις εκατομμυριοστή
          octillions: οκτάκις εκατομμυριοστή
          nonillions: εννεάκις εκατομμυριοστή
          decillions: δεκάκις εκατομμυριοστή
      neuter:
        ordinals:
          ones: [_, πρώτο, δεύτερο, τρίτο, τέταρτο, πέμπτο, έκτο, έβδομο, όγδοο, ένατο]
          teens: [δέκατο, ενδέκατο, δωδέκατο]
          tens: [_, δέκατο, εικοστό, τριακοστό, τεσσαρακοστό, πεντηκοστό, εξηκοστό, εβδομηκοστό, ογδοηκοστό, ενενηκοστό]
          hundreds: [_, εκατοστό, διακοσιοστό, τριακοσιοστό, τετρακοσιοστό, πεντακοσιοστό, εξακοσιοστό, επτακοσιοστό, οκτακοσιοστό, εννιακοσιοστό]
          thousands: [_, χιλιοστό, δισχιλιοστό, τρισχιλιοστό, τετρακισχιλιοστό, πεντακισχιλιοστό, εξακισχιλιοστό, επτακισχιλιοστό, οκτακισχιλιοστό, εννεακισχιλιοστό]
          thousand: χιλιοστό
          ten_thousand: δεκακισχιλιοστό
          millions: εκατομμυριοστό
          billions: δισεκατομμυριοστό
          trillions: τρισεκατομμυριοστό
          quadrillions: τετράκις εκατομμυριοστό
          quintillions: πεντάκις εκατομμυριοστό
          sextillions: εξάκις εκατομμυριοστό
          septillions: επτάκις εκατομμυριοστό
          octillions: οκτάκις εκατομμυριοστό
          nonillions: εννεάκις εκατομμυριοστό
          decillions: δεκάκις εκατομμυριοστό
    micro_separator: κόμμα
    subunit_separator: και
