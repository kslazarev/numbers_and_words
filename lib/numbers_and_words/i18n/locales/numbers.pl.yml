pl:
  numbers:
    # The plural category of a count (see NumbersAndWords::I18n::PluralRule); any other count is other.
    plural:
      one: 'v = 0 and i = 1'
      few: 'v = 0 and i % 10 = 2..4 and i % 100 != 12..14'
      many: 'v = 0'
    supported_options:
      case: {values: [nominative, genitive, dative, accusative, instrumental, locative]}
      gender: {values: [male, female, neuter], default: male}
      ordinal: true
      remove_zero: true
    minus: minus
    ones:
      male: [zero, jeden, dwa, trzy, cztery, pięć, sześć, siedem, osiem, dziewięć]
      female: [zero, jedna, dwie, trzy, cztery, pięć, sześć, siedem, osiem, dziewięć]
      neuter: [zero, jedno, dwa, trzy, cztery, pięć, sześć, siedem, osiem, dziewięć]
    # A final one after other digits, in every gender and case ("dwadzieścia jeden", "dwudziestu jeden").
    final_one: jeden
    teens: [_, jedenaście, dwanaście, trzynaście, czternaście, piętnaście, szesnaście, siedemnaście, osiemnaście, dziewiętnaście]
    tens: [_, dziesięć, dwadzieścia, trzydzieści, czterdzieści, pięćdziesiąt, sześćdziesiąt, siedemdziesiąt, osiemdziesiąt, dziewięćdziesiąt]
    hundreds: [_, sto, dwieście, trzysta, czterysta, pięćset, sześćset, siedemset, osiemset, dziewięćset]
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # How decimals are read (see Decorators.readings) and the genders of their parts (see RuleSets#decimal_gender).
    decimals: {reading: cs, integral_gender: female, fractional_gender: female}
    rules:
      cardinal-male:
        then: final-male
        0: '{ones.male}'
        10: '{tens}'
        11: '{teens%}'
        20: '{tens}[ {>}]'
        100: '{hundreds}[ {>}]'
        1000: '{<scale-count} {thousands}[ {>}]'
        1000000: '{<scale-count} {millions}[ {>}]'
        1000000000: '{<scale-count} {billions}[ {>}]'
        1000000000000: '{<scale-count} {trillions}[ {>}]'
        1000000000000000: '{<scale-count} {quadrillions}[ {>}]'
        1000000000000000000: '{<scale-count} {quintillions}[ {>}]'
        1000000000000000000000: '{<scale-count} {sextillions}[ {>}]'
        1000000000000000000000000: '{<scale-count} {septillions}[ {>}]'
        1000000000000000000000000000: '{<scale-count} {octillions}[ {>}]'
        1000000000000000000000000000000: '{<scale-count} {nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<scale-count} {decillions}[ {>}]'
        1000000000000000000000000000000000000: '{<scale-count} {undecillions}[ {>}]'
        1000000000000000000000000000000000000000: '{<scale-count} {duodecillions}[ {>}]'
        1000000000000000000000000000000000000000000: '{<scale-count} {tredecillions}[ {>}]'
        1000000000000000000000000000000000000000000000: '{<scale-count} {quattuordecillions}[ {>}]'
      # A final one after other digits is masculine whatever is counted ("dwadzieścia jeden", "tysiąc jeden").
      final-male:
        extends: cardinal-male
        1: '{final_one}'
        2: '{ones.male}'
      cardinal-female:
        extends: cardinal-male
        then: final-female
        0: '{ones.female}'
      final-female:
        extends: cardinal-female
        1: '{final_one}'
        2: '{ones.female}'
      cardinal-neuter:
        extends: cardinal-male
        then: final-neuter
        0: '{ones.neuter}'
      final-neuter:
        extends: cardinal-neuter
        1: '{final_one}'
        2: '{ones.neuter}'
      # A scale word's count is masculine, and a count of one is left out ("tysiąc", "milion", "dwa tysiące").
      scale-count:
        extends: cardinal-male
        then: final-male
        1: ''
        2: '{ones.male}'
      # A hundred is ordinal only when it ends the number ("dwusetny", but "sto dwudziesty pierwszy").
      ordinal:
        0: '{ordinals.ones}'
        10: '{ordinals.tens}'
        11: '{ordinals.teens%}'
        20: '{ordinals.tens}[ {>}]'
        100: '[{hundreds} {>}|{ordinals.hundreds}]'
        1000: '[{<scale-count} {thousands} {>}|{<ordinal-count}{ordinals.thousands}]'
        1000000: '[{<scale-count} {millions} {>}|{<ordinal-count}{ordinals.millions}]'
        1000000000: '[{<scale-count} {billions} {>}|{<ordinal-count}{ordinals.billions}]'
        1000000000000: '[{<scale-count} {trillions} {>}|{<ordinal-count}{ordinals.trillions}]'
        1000000000000000: '[{<scale-count} {quadrillions} {>}|{<ordinal-count}{ordinals.quadrillions}]'
        1000000000000000000: '[{<scale-count} {quintillions} {>}|{<ordinal-count}{ordinals.quintillions}]'
        1000000000000000000000: '[{<scale-count} {sextillions} {>}|{<ordinal-count}{ordinals.sextillions}]'
        1000000000000000000000000: '[{<scale-count} {septillions} {>}|{<ordinal-count}{ordinals.septillions}]'
        1000000000000000000000000000: '[{<scale-count} {octillions} {>}|{<ordinal-count}{ordinals.octillions}]'
        1000000000000000000000000000000: '[{<scale-count} {nonillions} {>}|{<ordinal-count}{ordinals.nonillions}]'
        1000000000000000000000000000000000: '[{<scale-count} {decillions} {>}|{<ordinal-count}{ordinals.decillions}]'
        1000000000000000000000000000000000000: '[{<scale-count} {undecillions} {>}|{<ordinal-count}{ordinals.undecillions}]'
        1000000000000000000000000000000000000000: '[{<scale-count} {duodecillions} {>}|{<ordinal-count}{ordinals.duodecillions}]'
        1000000000000000000000000000000000000000000: '[{<scale-count} {tredecillions} {>}|{<ordinal-count}{ordinals.tredecillions}]'
        1000000000000000000000000000000000000000000000: '[{<scale-count} {quattuordecillions} {>}|{<ordinal-count}{ordinals.quattuordecillions}]'
      # The count of a round scale ordinal joins it in its combining form ("dwutysięczny", "stutysięczny",
      # "dwudziestojednotysięczny"), and a count of one is left out ("tysięczny", "milionowy").
      ordinal-count:
        then: ordinal-count-rest
        1: ''
        2: '{combining.ones}'
        10: '{combining.tens}'
        11: '{combining.teens%}'
        20: '{combining.tens}[{>}]'
        100: '{combining.hundreds}[{>}]'
      ordinal-count-rest:
        extends: ordinal-count
        1: '{combining.ones}'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions, undecillions, duodecillions, tredecillions, quattuordecillions]
    thousands: { one: tysiąc, few: tysiące, many: tysięcy, other: tysiąca }
    millions: { one: milion, few: miliony, many: milionów, other: miliona }
    billions: { one: miliard, few: miliardy, many: miliardów, other: miliarda }
    trillions: { one: bilion, few: biliony, many: bilionów, other: biliona }
    quadrillions: { one: biliard, few: biliardy, many: biliardów, other: biliarda }
    quintillions: { one: trylion, few: tryliony, many: trylionów, other: tryliona }
    sextillions: { one: tryliard, few: tryliardy, many: tryliardów, other: tryliarda }
    septillions: { one: kwadrylion, few: kwadryliony, many: kwadrylionów, other: kwadryliona }
    octillions: { one: kwadryliard, few: kwadryliardy, many: kwadryliardów, other: kwadryliarda }
    nonillions: { one: kwintylion, few: kwintyliony, many: kwintylionów, other: kwintyliona }
    decillions: { one: kwintyliard, few: kwintyliardy, many: kwintyliardów, other: kwintyliarda }
    undecillions: { one: sekstylion, few: sekstyliony, many: sekstylionów, other: sekstyliona }
    duodecillions: { one: sekstyliard, few: sekstyliardy, many: sekstyliardów, other: sekstyliarda }
    tredecillions: { one: septylion, few: septyliony, many: septylionów, other: septyliona }
    quattuordecillions: { one: septyliard, few: septyliardy, many: septyliardów, other: septyliarda }
    ordinals:
      ones: [zerowy, pierwszy, drugi, trzeci, czwarty, piąty, szósty, siódmy, ósmy, dziewiąty]
      teens: [_, jedenasty, dwunasty, trzynasty, czternasty, piętnasty, szesnasty, siedemnasty, osiemnasty, dziewiętnasty]
      tens: [_, dziesiąty, dwudziesty, trzydziesty, czterdziesty, pięćdziesiąty, sześćdziesiąty, siedemdziesiąty, osiemdziesiąty, dziewięćdziesiąty]
      hundreds: [_, setny, dwusetny, trzechsetny, czterechsetny, pięćsetny, sześćsetny, siedemsetny, osiemsetny, dziewięćsetny]
      thousands: tysięczny
      millions: milionowy
      billions: miliardowy
      trillions: bilionowy
      quadrillions: biliardowy
      quintillions: trylionowy
      sextillions: tryliardowy
      septillions: kwadrylionowy
      octillions: kwadryliardowy
      nonillions: kwintylionowy
      decillions: kwintyliardowy
      undecillions: sekstylionowy
      duodecillions: sekstyliardowy
      tredecillions: septylionowy
      quattuordecillions: septyliardowy
    # Words in the other cases, where they differ from the nominative ones above (see Unicode CLDR's Polish
    # spellout-cardinal-<gender>-<case> rules); a scale word is in the singular after one and in the plural after
    # any other count ("dwóch tysięcy", "pięcioma tysiącami"), and a final one after other digits stays jeden.
    cases:
