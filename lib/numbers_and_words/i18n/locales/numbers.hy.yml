hy:
  numbers:
    supported_options:
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
    minus: մինուս
    # How decimals are read (see Decorators.readings), after micro_separator.
    decimals: {reading: digits}
    micro_separator: ստորակետ
    ones: [զրո, մեկ, երկու, երեք, չորս, հինգ, վեց, յոթ, ութ, ինը]
    teens: [_, տասնմեկ, տասներկու, տասներեք, տասնչորս, տասնհինգ, տասնվեց, տասնյոթ, տասնութ, տասնինը]
    tens: [_, տասը, քսան, երեսուն, քառասուն, հիսուն, վաթսուն, յոթանասուն, ութսուն, իննսուն]
    hundreds: հարյուր
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    rules:
      cardinal:
        0: '{ones}'
        10: '{tens}'
        11: '{teens%}'
        20: '{tens}[{>}]'
        100: '{hundreds}[ {>}]'
        200: '{ones} {hundreds}[ {>}]'
        1000: '{thousands}[ {>}]'
        2000: '{<cardinal} {thousands}[ {>}]'
        1000000: '{<cardinal} {millions}[ {>}]'
        1000000000: '{<cardinal} {billions}[ {>}]'
        1000000000000: '{<cardinal} {trillions}[ {>}]'
        1000000000000000: '{<cardinal} {quadrillions}[ {>}]'
        1000000000000000000: '{<cardinal} {quintillions}[ {>}]'
        1000000000000000000000: '{<cardinal} {sextillions}[ {>}]'
        1000000000000000000000000: '{<cardinal} {septillions}[ {>}]'
        1000000000000000000000000000: '{<cardinal} {octillions}[ {>}]'
        1000000000000000000000000000000: '{<cardinal} {nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<cardinal} {decillions}[ {>}]'
      # One to four have ordinals of their own ("առաջին"); the others add -երորդ to their last word ("քսանմեկերորդ"),
      # and a leading one before a single scale word is left out ("միլիոներորդ").
      ordinal:
        then: ordinal-inner
        0: '{ordinals.ones}'
        1: '{ordinals.first}'
        5: '{ordinals.ones}'
        10: '{ordinals.tens}'
        11: '{ordinals.teens%}'
        20: '[{tens}{ordinals.ones%}|{ordinals.tens}]'
        100: '[{hundreds} {>}|{ordinals.hundreds}]'
        200: '[{ones} {hundreds} {>}|{ones} {ordinals.hundreds}]'
        1000: '[{thousands} {>}|{ordinals.thousands}]'
        2000: '[{<cardinal} {thousands} {>}|{<cardinal} {ordinals.thousands}]'
        1000000: '[{<cardinal} {millions} {>}|{<count} {ordinals.millions}]'
        1000000000: '[{<cardinal} {billions} {>}|{<count} {ordinals.billions}]'
        1000000000000: '[{<cardinal} {trillions} {>}|{<count} {ordinals.trillions}]'
        1000000000000000: '[{<cardinal} {quadrillions} {>}|{<count} {ordinals.quadrillions}]'
        1000000000000000000: '[{<cardinal} {quintillions} {>}|{<count} {ordinals.quintillions}]'
        1000000000000000000000: '[{<cardinal} {sextillions} {>}|{<count} {ordinals.sextillions}]'
        1000000000000000000000000: '[{<cardinal} {septillions} {>}|{<count} {ordinals.septillions}]'
        1000000000000000000000000000: '[{<cardinal} {octillions} {>}|{<count} {ordinals.octillions}]'
        1000000000000000000000000000000: '[{<cardinal} {nonillions} {>}|{<count} {ordinals.nonillions}]'
        1000000000000000000000000000000000: '[{<cardinal} {decillions} {>}|{<count} {ordinals.decillions}]'
      ordinal-inner:
        extends: ordinal
        1: '{ordinals.ones}'
        1000000: '[{<cardinal} {millions} {>}|{<cardinal} {ordinals.millions}]'
        1000000000: '[{<cardinal} {billions} {>}|{<cardinal} {ordinals.billions}]'
        1000000000000: '[{<cardinal} {trillions} {>}|{<cardinal} {ordinals.trillions}]'
        1000000000000000: '[{<cardinal} {quadrillions} {>}|{<cardinal} {ordinals.quadrillions}]'
        1000000000000000000: '[{<cardinal} {quintillions} {>}|{<cardinal} {ordinals.quintillions}]'
        1000000000000000000000: '[{<cardinal} {sextillions} {>}|{<cardinal} {ordinals.sextillions}]'
        1000000000000000000000000: '[{<cardinal} {septillions} {>}|{<cardinal} {ordinals.septillions}]'
        1000000000000000000000000000: '[{<cardinal} {octillions} {>}|{<cardinal} {ordinals.octillions}]'
        1000000000000000000000000000000: '[{<cardinal} {nonillions} {>}|{<cardinal} {ordinals.nonillions}]'
        1000000000000000000000000000000000: '[{<cardinal} {decillions} {>}|{<cardinal} {ordinals.decillions}]'
      count:
        extends: cardinal
        then: cardinal
        1: ''
        2: '{ones}'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousands: հազար
    millions: միլիոն
    billions: միլիարդ
    trillions: տրիլիոն
    quadrillions: կվադրիլիոն
    quintillions: կվինտիլիոն
    sextillions: սեքստիլիոն
    septillions: սեպտիլիոն
    octillions: օկտիլիոն
    nonillions: նոնիլիոն
    decillions: դեցիլիոն
    ordinals:
      first: [_, առաջին, երկրորդ, երրորդ, չորրորդ]
      ones: [զրոերորդ, մեկերորդ, երկուերորդ, երեքերորդ, չորսերորդ, հինգերորդ, վեցերորդ, յոթերորդ, ութերորդ, իններորդ]
      teens: [_, տասնմեկերորդ, տասներկուերորդ, տասներեքերորդ, տասնչորսերորդ, տասնհինգերորդ, տասնվեցերորդ, տասնյոթերորդ, տասնութերորդ, տասնիններորդ]
      tens: [_, տասներորդ, քսաներորդ, երեսուներորդ, քառասուներորդ, հիսուներորդ, վաթսուներորդ, յոթանասուներորդ, ութսուներորդ, իննսուներորդ]
      hundreds: հարյուրերորդ
      thousands: հազարերորդ
      millions: միլիոներորդ
      billions: միլիարդերորդ
      trillions: տրիլիոներորդ
      quadrillions: կվադրիլիոներորդ
      quintillions: կվինտիլիոներորդ
      sextillions: սեքստիլիոներորդ
      septillions: սեպտիլիոներորդ
      octillions: օկտիլիոներորդ
      nonillions: նոնիլիոներորդ
      decillions: դեցիլիոներորդ
