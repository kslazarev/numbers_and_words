pt:
  numbers:
    supported_options:
      fraction: true
      gender: {values: [male, female], default: male}
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
    minus: menos
    ones: [zero, um, dois, três, quatro, cinco, seis, sete, oito, nove]
    teens: [_, onze, doze, treze, catorze, quinze, dezasseis, dezassete, dezoito, dezanove]
    tens: [_, dez, vinte, trinta, quarenta, cinquenta, sessenta, setenta, oitenta, noventa]
    hundreds: [_, cento, duzentos, trezentos, quatrocentos, quinhentos, seiscentos, setecentos, oitocentos, novecentos]
    one_hundred: cem
    # gender: :female, for the groups below a million (duas mil libras, but dois milhões).
    female:
      ones: [zero, uma, duas, três, quatro, cinco, seis, sete, oito, nove]
      hundreds: [_, cento, duzentas, trezentas, quatrocentas, quinhentas, seiscentas, setecentas, oitocentas, novecentas]
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # The long scale counts millions up to a million ("mil e um milhões"), and "e" comes before a last group below a
    # hundred or of round hundreds ("um bilião e um milhão", "mil e cem").
    # How decimals are read (see Decorators.readings) and the genders of their parts (see RuleSets#decimal_gender).
    decimals: {reading: pt-BR, fraction_gender: male}
    rules:
      cardinal-male:
        then: and-male
        0: '{ones}'
        10: '{tens}'
        11: '{teens%}'
        20: '{tens}[ {union} {>cardinal-male}]'
        100: '[{hundreds} {union} {>cardinal-male}|{one_hundred}]'
        200: '{hundreds}[ {union} {>cardinal-male}]'
        1000: '{<thousands-count-male} {thousands}[{>}]'
        1000000: '{<cardinal-male} {millions}[{>}]'
        1000000000000: '{<cardinal-male} {trillions}[{>}]'
        1000000000000000000: '{<cardinal-male} {quintillions}[{>}]'
        1000000000000000000000000: '{<cardinal-male} {septillions}[{>}]'
        1000000000000000000000000000000: '{<cardinal-male} {nonillions}[{>}]'
      cardinal-female:
        extends: cardinal-male
        then: and-female
        0: '{female.ones}'
        20: '{tens}[ {union} {>cardinal-female}]'
        100: '[{female.hundreds} {union} {>cardinal-female}|{one_hundred}]'
        200: '{female.hundreds}[ {union} {>cardinal-female}]'
        1000: '{<thousands-count-female} {thousands}[{>}]'
      thousands-count-male:
        extends: cardinal-male
        1: ''
        2: '{ones}'
      thousands-count-female:
        extends: cardinal-female
        1: ''
        2: '{female.ones}'
      and-male:
        then: cardinal-male
        1: ' {union} {=}'
        '100*1000': '[ {=}| {union} {=}]'
        '1000*1000': '[ {=}| {union} {=}]'
      and-female:
        extends: and-male
        then: cardinal-female
      # Each group of an ordinal is ordinal, and a count of one is left out before a scale ordinal ("milésimo").
      ordinal:
        0: '{ordinals.units}'
        10: '{ordinals.tens}[ {>}]'
        100: '{ordinals.hundreds}[ {>}]'
        1000: '{<ordinal-count} {ordinals.thousand}[ {>}]'
        1000000: '{<ordinal-count} {ordinals.millions}[ {>}]'
        1000000000000: '{<ordinal-count} {ordinals.trillions}[ {>}]'
        1000000000000000000: '{<ordinal-count} {ordinals.quintillions}[ {>}]'
        1000000000000000000000000: '{<ordinal-count} {ordinals.septillions}[ {>}]'
        1000000000000000000000000000000: '{<ordinal-count} {ordinals.nonillions}[ {>}]'
      ordinal-count:
        extends: ordinal
        then: ordinal
        1: ''
        2: '{ordinals.units}'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousands: mil
    millions:
      one: milhão
      other: milhões
    billions: mil milhões
    trillions:
      one: bilião
      other: biliões
    quadrillions: mil biliões
    quintillions:
      one: trilião
      other: triliões
    sextillions: mil triliões
    septillions:
      one: quatrilião
      other: quatriliões
    octillions: mil quatriliões
    nonillions:
      one: quintilião
      other: quintiliões
    decillions: mil quintiliões
    union: e
    integral:
      one: inteiro
      other: inteiros
    micro: [_, tenths, hundredths, thousandths, millionths, billionths, trillionths, quadrillionths, quintillionths]
    tenths:
      one: décimo
      other: décimos
    hundredths:
      one: centésimo
      other: centésimos
    thousandths:
      one: milésimo
      other: milésimos
    millionths:
      one: milionésimo
      other: milionésimos
    billionths:
      one: milésimo de milionésimo
      other: milésimos de milionésimo
    trillionths:
      one: bilionésimo
      other: bilionésimos
    quadrillionths:
      one: milésimo de bilionésimo
      other: milésimos de bilionésimo
    quintillionths:
      one: trilionésimo
      other: trilionésimos
    micro_separator: vírgula
    subunit_separator: e
    unit_scale_preposition: de
    fraction_separator: e
    micro_prefix:
      tens:
        one: décimo
        other: décimos
      hundreds:
        one: centésimo
        other: centésimos
      union: ' de '
    ordinals:
      units: [zero, primeiro, segundo, terceiro, quarto, quinto, sexto, sétimo, oitavo, nono]
      tens: [_, décimo, vigésimo, trigésimo, quadragésimo, quinquagésimo, sexagésimo, septuagésimo, octogésimo, nonagésimo]
      hundreds: [_, centésimo, ducentésimo, trecentésimo, quadringentésimo, quingentésimo, sexcentésimo, septingentésimo, octingentésimo, noningentésimo]
      thousand: milésimo
      millions: milionésimo
      trillions: bilionésimo
      quintillions: trilionésimo
      septillions: quatrilionésimo
      nonillions: quintilionésimo
    # The feminine ordinals.
    genders:
      female:
        ordinals:
          units: [zero, primeira, segunda, terceira, quarta, quinta, sexta, sétima, oitava, nona]
          tens: [_, décima, vigésima, trigésima, quadragésima, quinquagésima, sexagésima, septuagésima, octogésima, nonagésima]
          hundreds: [_, centésima, ducentésima, trecentésima, quadringentésima, quingentésima, sexcentésima, septingentésima, octingentésima, noningentésima]
          thousand: milésima
          millions: milionésima
          trillions: bilionésima
          quintillions: trilionésima
          septillions: quatrilionésima
          nonillions: quintilionésima
