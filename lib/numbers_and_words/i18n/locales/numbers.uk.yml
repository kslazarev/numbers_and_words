      few: цілих
      many: цілих
    micro: [_, tenths, hundredths, thousandths, millionths, billionths, trillionths, quadrillionths, quintillionths, sextillionths]
    tenths:
      one: десята
      few: десятих
      many: десятих
    hundredths:
      one: сота
      few: сотих
      many: сотих
    thousandths:
      one: тисячна
      few: тисячних
      many: тисячних
    millionths:
      one: мільйонна
      few: мільйонних
      many: мільйонних
    billionths:
      one: мільярдна
      few: мільярдних
      many: мільярдних
    trillionths:
      one: трильйонна
      few: трильйонних
      many: трильйонних
    quadrillionths:
      one: квадрильйонна
      few: квадрильйонних
      many: квадрильйонних
    quintillionths:
      one: квінтильйонна
      few: квінтильйонних
      many: квінтильйонних
    sextillionths:
      one: секстильйонна
      few: секстильйонних
      many: секстильйонних
    micro_separator: 'і'
    micro_prefix:
      tens: десяти
      hundreds: сто
      union: ''
    union: 'і'
    # Words in the other cases, where they differ from the nominative ones above; a scale word is in the singular
    # after a count ending in one ("двадцяти однієї тисячі") and in the plural otherwise ("двох тисяч"). The vocative
    # of a cardinal is its nominative.
    cases:
      genitive:
        ones:
          male: [нуля, одного, двох, трьох, чотирьох, п’яти, шести, семи, восьми, дев’яти]
          female: [нуля, однієї, двох, трьох, чотирьох, п’яти, шести, семи, восьми, дев’яти]
          neuter: [нуля, одного, двох, трьох, чотирьох, п’яти, шести, семи, восьми, дев’яти]
        teens: [_, одинадцяти, дванадцяти, тринадцяти, чотирнадцяти, п’ятнадцяти, шістнадцяти, сімнадцяти, вісімнадцяти, дев’ятнадцяти]
        tens: [_, десяти, двадцяти, тридцяти, сорока, п’ятдесяти, шістдесяти, сімдесяти, вісімдесяти, дев’яноста]
        hundreds: [_, ста, двохсот, трьохсот, чотирьохсот, п’ятисот, шестисот, семисот, восьмисот, дев’ятисот]
