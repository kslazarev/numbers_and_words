          neuter: [нулі, одному, двох, трьох, чотирьох, п’яти, шести, семи, восьми, дев’яти]
        teens: [_, одинадцяти, дванадцяти, тринадцяти, чотирнадцяти, п’ятнадцяти, шістнадцяти, сімнадцяти, вісімнадцяти, дев’ятнадцяти]
        tens: [_, десяти, двадцяти, тридцяти, сорока, п’ятдесяти, шістдесяти, сімдесяти, вісімдесяти, дев’яноста]
        hundreds: [_, ста, двохстах, трьохстах, чотирьохстах, п’ятистах, шестистах, семистах, восьмистах, дев’ятистах]
        thousands: {one: тисячі, few: тисячах, many: тисячах}
        millions: {one: мільйоні, few: мільйонах, many: мільйонах}
        billions: {one: мільярді, few: мільярдах, many: мільярдах}
