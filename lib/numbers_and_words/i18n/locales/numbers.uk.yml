        quintillions: {one: квінтильйона, few: квінтильйонів, many: квінтильйонів}
        sextillions: {one: секстильйона, few: секстильйонів, many: секстильйонів}
        septillions: {one: септильйона, few: септильйонів, many: септильйонів}
