        nonillions: {one: нонильйона, few: нонильйонів, many: нонильйонів}
        decillions: {one: децильйона, few: децильйонів, many: децильйонів}
      dative:
        ones:
          male: [нулю, одному, двом, трьом, чотирьом, п’яти, шести, семи, восьми, дев’яти]
          female: [нулю, одній, двом, трьом, чотирьом, п’яти, шести, семи, восьми, дев’яти]
          neuter: [нулю, одному, двом, трьом, чотирьом, п’яти, шести, семи, восьми, дев’яти]
        teens: [_, одинадцяти, дванадцяти, тринадцяти, чотирнадцяти, п’ятнадцяти, шістнадцяти, сімнадцяти, вісімнадцяти, дев’ятнадцяти]
        tens: [_, десяти, двадцяти, тридцяти, сорока, п’ятдесяти, шістдесяти, сімдесяти, вісімдесяти, дев’яноста]
        hundreds: [_, ста, двомстам, трьомстам, чотирьомстам, п’ятистам, шестистам, семистам, восьмистам, дев’ятистам]
        thousands: {one: тисячі, few: тисячам, many: тисячам}
        millions: {one: мільйону, few: мільйонам, many: мільйонам}
        billions: {one: мільярду, few: мільярдам, many: мільярдам}
        trillions: {one: трильйону, few: трильйонам, many: трильйонам}
        quadrillions: {one: квадрильйону, few: квадрильйонам, many: квадрильйонам}
        quintillions: {one: квінтильйону, few: квінтильйонам, many: квінтильйонам}
        sextillions: {one: секстильйону, few: секстильйонам, many: секстильйонам}
