          female: [нулем, однією, двома, трьома, чотирма, п’ятьма, шістьма, сьома, вісьма, дев’ятьма]
          neuter: [нулем, одним, двома, трьома, чотирма, п’ятьма, шістьма, сьома, вісьма, дев’ятьма]
        teens: [_, одинадцятьма, дванадцятьма, тринадцятьма, чотирнадцятьма, п’ятнадцятьма, шістнадцятьма, сімнадцятьма, вісімнадцятьма, дев’ятнадцятьма]
        tens: [_, десятьма, двадцятьма, тридцятьма, сорока, п’ятдесятьма, шістдесятьма, сімдесятьма, вісімдесятьма, дев’яноста]
        hundreds: [_, ста, двомастами, трьомастами, чотирмастами, п’ятьмастами, шістьмастами, сьомастами, вісьмастами, дев’ятьмастами]
