uk:
  numbers:
    minus: мінус
    ones:
      male: [нуль, один, два, три, чотири, п’ять, шість, сім, вісім, дев’ять]
      female: [нуль, одна, дві, три, чотири, п’ять, шість, сім, вісім, дев’ять]
      neuter: [нуль, одне, два, три, чотири, п’ять, шість, сім, вісім, дев’ять]
    teens: [_, одинадцять, дванадцять, тринадцять, чотирнадцять, п’ятнадцять, шістнадцять, сімнадцять, вісімнадцять, дев’ятнадцять]
    tens: [_, десять, двадцять, тридцять, сорок, п’ятдесят, шістдесят, сімдесят, вісімдесят, дев’яносто]
    hundreds: [_, сто, двісті, триста, чотириста, п’ятсот, шістсот, сімсот, вісімсот, дев’ятсот]
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    rules:
      cardinal-male:
        0: '{ones.male}'
        10: '{tens}'
        11: '{teens%}'
        20: '{tens}[ {>}]'
        100: '{hundreds}[ {>}]'
        1000: '{<cardinal-female} {thousands}[ {>}]'
        1000000: '{<cardinal-male} {millions}[ {>}]'
        1000000000: '{<cardinal-male} {billions}[ {>}]'
        1000000000000: '{<cardinal-male} {trillions}[ {>}]'
        1000000000000000: '{<cardinal-male} {quadrillions}[ {>}]'
        1000000000000000000: '{<cardinal-male} {quintillions}[ {>}]'
        1000000000000000000000: '{<cardinal-male} {sextillions}[ {>}]'
        1000000000000000000000000: '{<cardinal-male} {septillions}[ {>}]'
        1000000000000000000000000000: '{<cardinal-male} {octillions}[ {>}]'
        1000000000000000000000000000000: '{<cardinal-male} {nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<cardinal-male} {decillions}[ {>}]'
      cardinal-female:
        extends: cardinal-male
        0: '{ones.female}'
      cardinal-neuter:
        extends: cardinal-male
        0: '{ones.neuter}'
      # The animate accusative: a final "один" and a lone "два", "три" or "чотири" take the genitive ("бачу двадцять
      # одного", "бачу двох"), while compounds ending in two to four keep the nominative ("бачу двадцять два").
      cardinal-male-animate:
        extends: cardinal-male
        then: final-one-animate
        1: одного
        2: двох
        3: трьох
        4: чотирьох
        5: '{ones.male}'
      final-one-animate:
        extends: cardinal-male
        1: одного
        2: '{ones.male}'
      cardinal-female-animate:
        extends: cardinal-female
        then: cardinal-female
        2: двох
        3: трьох
        4: чотирьох
        5: '{ones.female}'
      cardinal-neuter-animate:
        extends: cardinal-neuter
        then: cardinal-neuter
        2: двох
        3: трьох
        4: чотирьох
        5: '{ones.neuter}'
      # Ordinals, in the masculine nominative: only the last word is ordinal ("двадцять перший"), a scale group of
      # exactly one omits that one ("тисяча перший"), and a round scale word joins its multiplier ("двохтисячний").
      ordinal:
        0: '{ordinals.ones}'
        10: '{ordinals.tens}'
        11: '{ordinals.teens%}'
        20: '[{tens} {>}|{ordinals.tens}]'
        100: '[{hundreds} {>}|{ordinals.hundreds}]'
        1000: '[{<scale-count-female} {thousands} {>}|{<combining}тисячний]'
        1000000: '[{<scale-count} {millions} {>}|{<combining}мільйонний]'
        1000000000: '[{<scale-count} {billions} {>}|{<combining}мільярдний]'
        1000000000000: '[{<scale-count} {trillions} {>}|{<combining}трильйонний]'
        1000000000000000: '[{<scale-count} {quadrillions} {>}|{<combining}квадрильйонний]'
        1000000000000000000: '[{<scale-count} {quintillions} {>}|{<combining}квінтильйонний]'
        1000000000000000000000: '[{<scale-count} {sextillions} {>}|{<combining}секстильйонний]'
        1000000000000000000000000: '[{<scale-count} {septillions} {>}|{<combining}септильйонний]'
        1000000000000000000000000000: '[{<scale-count} {octillions} {>}|{<combining}октильйонний]'
        1000000000000000000000000000000: '[{<scale-count} {nonillions} {>}|{<combining}нонильйонний]'
        1000000000000000000000000000000000: '[{<scale-count} {decillions} {>}|{<combining}децильйонний]'
      scale-count:
        extends: cardinal-male
        then: cardinal-male
        1: ''
        2: '{ones.male}'
      scale-count-female:
        extends: cardinal-female
        then: cardinal-female
        1: ''
        2: '{ones.female}'
      combining:
        then: combining-rest
        1: ''
        2: '{ordinals.combining_ones}'
        10: '{ordinals.combining_tens}'
        11: '{ordinals.combining_teens%}'
        20: '{ordinals.combining_tens}[{>}]'
        100: '{ordinals.combining_hundreds}[{>}]'
      combining-rest:
        extends: combining
        1: '{ordinals.combining_ones}'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousands:
      one: тисяча
      few: тисячі
      many: тисяч
    millions:
