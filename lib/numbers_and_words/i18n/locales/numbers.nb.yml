nb:
  numbers:
    supported_options:
      gender: {values: [male, female, neuter], default: male}
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
    minus: minus
    ones: ["null", en, to, tre, fire, fem, seks, sju, åtte, ni]
    last_one: en
    one:
      male: en
      female: ei
      neuter: ett
    teens: [ti, elleve, tolv, tretten, fjorten, femten, seksten, sytten, atten, nitten]
    tens: [_, _, tjue, tretti, førti, femti, seksti, sytti, åtti, nitti]
    hundred: hundre
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # One is left out before hundre and tusen only at the start ("hundre", "tusen ett hundre"), "og" comes after
    # hundreds and before a last group below a hundred ("tusen og en"), and a final one takes the gender asked for.
    # How decimals are read (see Decorators.readings).
    decimals: {reading: digits}
    rules:
      cardinal:
        then: after
        0: '{ones}'
        1: '{last_one}'
        2: '{ones}'
        10: '{teens%}'
        20: '{tens}[{>digits}]'
        100: '{<hundreds-first} {hundred}[ {union} {>cardinal}]'
        1000: '{<thousands-first} {thousands}[{>}]'
        1000000: '{<group-first} {millions}[{>}]'
        1000000000: '{<group-first} {billions}[{>}]'
        1000000000000: '{<group-first} {trillions}[{>}]'
        1000000000000000: '{<group-first} {quadrillions}[{>}]'
        1000000000000000000: '{<group-first} {quintillions}[{>}]'
        1000000000000000000000: '{<group-first} {sextillions}[{>}]'
        1000000000000000000000000: '{<group-first} {septillions}[{>}]'
        1000000000000000000000000000: '{<group-first} {octillions}[{>}]'
        1000000000000000000000000000000: '{<group-first} {nonillions}[{>}]'
        1000000000000000000000000000000000: '{<group-first} {decillions}[{>}]'
      inner:
        extends: cardinal
        100: '{<hundreds-inner} {hundred}[ {union} {>cardinal}]'
        1000: '{<thousands-inner} {thousands}[{>}]'
        1000000: '{<group-inner} {millions}[{>}]'
        1000000000: '{<group-inner} {billions}[{>}]'
        1000000000000: '{<group-inner} {trillions}[{>}]'
        1000000000000000: '{<group-inner} {quadrillions}[{>}]'
        1000000000000000000: '{<group-inner} {quintillions}[{>}]'
        1000000000000000000000: '{<group-inner} {sextillions}[{>}]'
        1000000000000000000000000: '{<group-inner} {septillions}[{>}]'
        1000000000000000000000000000: '{<group-inner} {octillions}[{>}]'
        1000000000000000000000000000000: '{<group-inner} {nonillions}[{>}]'
        1000000000000000000000000000000000: '{<group-inner} {decillions}[{>}]'
      after:
        then: inner
        1: ' {union} {=}'
        100: ' {=}'
      digits:
        0: '{ones}'
      # The count of a scale word: a final one is "en", or "ett" before tusen.
      group-first:
        0: '{ones}'
        10: '{teens%}'
        20: '{tens}[{>digits}]'
        100: '{<hundreds-first} {hundred}[ {union} {>group-first}]'
      group-inner:
        extends: group-first
        100: '{<hundreds-inner} {hundred}[ {union} {>group-first}]'
      thousands-first:
        extends: group-first
        1: ''
        2: '{ones}'
        100: '{<hundreds-first} {hundred}[ {union} {>neuter}]'
      thousands-inner:
        extends: group-first
        1: '{one.neuter}'
        2: '{ones}'
        100: '{<hundreds-inner} {hundred}[ {union} {>neuter}]'
      neuter:
        extends: group-first
        1: '{one.neuter}'
        2: '{ones}'
      hundreds-first:
        0: '{ones}'
        1: ''
        2: '{ones}'
      hundreds-inner:
        0: '{ones}'
        1: '{one.neuter}'
        2: '{ones}'
      # The last word of an ordinal is ordinal, and "en" before a single scale word is left out ("millionte").
      ordinal:
        0: '{ordinals.ones}'
        10: '{ordinals.teens%}'
        20: '[{tens}{ordinals.ones%}|{ordinals.tens}]'
        100: '{<hundreds-first} [{hundred} {union} {>ordinal}|{ordinals.hundred}]'
        1000: '{<thousands-first} [{thousands}{>ordinal-after}|{ordinals.thousands}]'
        1000000: '[{<group-first} {millions}{>ordinal-after}|{<ordinal-count} {ordinals.millions}]'
        1000000000: '[{<group-first} {billions}{>ordinal-after}|{<ordinal-count} {ordinals.billions}]'
        1000000000000: '[{<group-first} {trillions}{>ordinal-after}|{<ordinal-count} {ordinals.trillions}]'
        1000000000000000: '[{<group-first} {quadrillions}{>ordinal-after}|{<ordinal-count} {ordinals.quadrillions}]'
        1000000000000000000: '[{<group-first} {quintillions}{>ordinal-after}|{<ordinal-count} {ordinals.quintillions}]'
        1000000000000000000000: '[{<group-first} {sextillions}{>ordinal-after}|{<ordinal-count} {ordinals.sextillions}]'
        1000000000000000000000000: '[{<group-first} {septillions}{>ordinal-after}|{<ordinal-count} {ordinals.septillions}]'
        1000000000000000000000000000: '[{<group-first} {octillions}{>ordinal-after}|{<ordinal-count} {ordinals.octillions}]'
        1000000000000000000000000000000: '[{<group-first} {nonillions}{>ordinal-after}|{<ordinal-count} {ordinals.nonillions}]'
        1000000000000000000000000000000000: '[{<group-first} {decillions}{>ordinal-after}|{<ordinal-count} {ordinals.decillions}]'
      ordinal-inner:
        extends: ordinal
        100: '{<hundreds-inner} [{hundred} {union} {>ordinal}|{ordinals.hundred}]'
        1000: '{<thousands-inner} [{thousands}{>ordinal-after}|{ordinals.thousands}]'
        1000000: '{<group-inner} [{millions}{>ordinal-after}|{ordinals.millions}]'
        1000000000: '{<group-inner} [{billions}{>ordinal-after}|{ordinals.billions}]'
        1000000000000: '{<group-inner} [{trillions}{>ordinal-after}|{ordinals.trillions}]'
        1000000000000000: '{<group-inner} [{quadrillions}{>ordinal-after}|{ordinals.quadrillions}]'
        1000000000000000000: '{<group-inner} [{quintillions}{>ordinal-after}|{ordinals.quintillions}]'
        1000000000000000000000: '{<group-inner} [{sextillions}{>ordinal-after}|{ordinals.sextillions}]'
        1000000000000000000000000: '{<group-inner} [{septillions}{>ordinal-after}|{ordinals.septillions}]'
        1000000000000000000000000000: '{<group-inner} [{octillions}{>ordinal-after}|{ordinals.octillions}]'
        1000000000000000000000000000000: '{<group-inner} [{nonillions}{>ordinal-after}|{ordinals.nonillions}]'
        1000000000000000000000000000000000: '{<group-inner} [{decillions}{>ordinal-after}|{ordinals.decillions}]'
      ordinal-after:
        then: ordinal-inner
        1: ' {union} {=}'
        100: ' {=}'
      ordinal-count:
        extends: group-first
        1: ''
        2: '{ones}'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousands: {one: tusen, other: tusen}
    millions: {one: million, other: millioner}
    billions: {one: milliard, other: milliarder}
    trillions: {one: billion, other: billioner}
    quadrillions: {one: billiard, other: billiarder}
    quintillions: {one: trillion, other: trillioner}
    sextillions: {one: trilliard, other: trilliarder}
    septillions: {one: kvadrillion, other: kvadrillioner}
    octillions: {one: kvadrilliard, other: kvadrilliarder}
    nonillions: {one: kvintillion, other: kvintillioner}
    decillions: {one: kvintilliard, other: kvintilliarder}
    union: og
    micro_separator: komma
    ordinals:
      ones: [nullte, første, andre, tredje, fjerde, femte, sjette, sjuende, åttende, niende]
      teens: [tiende, ellevte, tolvte, trettende, fjortende, femtende, sekstende, syttende, attende, nittende]
      tens: [_, _, tjuende, trettiende, førtiende, femtiende, sekstiende, syttiende, åttiende, nittiende]
      hundred: hundrede
      thousands: tusende
      millions: millionte
      billions: milliardte
      trillions: billionte
      quadrillions: billiardte
      quintillions: trillionte
      sextillions: trilliardte
      septillions: kvadrillionte
      octillions: kvadrilliardte
      nonillions: kvintillionte
      decillions: kvintilliardte
    # The gender of a final one ("ei", "ett").
    genders:
      female:
        last_one: ei
      neuter:
        last_one: ett
    subunit_separator: og
