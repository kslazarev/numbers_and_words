ur:
  numbers:
    supported_options:
      gender: {values: [male, female], default: male}
      ordinal: true
      remove_zero: true
    minus: منفی
    # Every number from 0 to 99 is its own word.
    ones:
      - صفر
      - ایک
      - دو
      - تین
      - چار
      - پانچ
      - چھ
      - سات
      - آٹھ
      - نو
      - دس
      - گیارہ
      - بارہ
      - تیرہ
      - چودہ
      - پندرہ
      - سولہ
      - سترہ
      - اٹھارہ
      - انیس
      - بیس
      - اکیس
      - بائیس
      - تئیس
      - چوبیس
      - پچیس
      - چھبیس
      - ستائیس
      - اٹھائیس
      - انتیس
      - تیس
      - اکتیس
      - بتیس
      - تینتیس
      - چونتیس
      - پینتیس
      - چھتیس
      - سینتیس
      - اڑتیس
      - انتالیس
      - چالیس
      - اکتالیس
      - بیالیس
      - تینتالیس
      - چوالیس
      - پینتالیس
      - چھیالیس
      - سینتالیس
      - اڑتالیس
      - انچاس
      - پچاس
      - اکاون
      - باون
      - ترپن
      - چون
      - پچپن
      - چھپن
      - ستاون
      - اٹھاون
      - انسٹھ
      - ساٹھ
      - اکسٹھ
      - باسٹھ
      - تریسٹھ
      - چونسٹھ
      - پینسٹھ
      - چھیاسٹھ
      - سڑسٹھ
      - اڑسٹھ
      - انہتر
      - ستر
      - اکہتر
      - بہتر
      - تہتر
      - چوہتر
      - پچہتر
      - چھہتر
      - ستتر
      - اٹھہتر
      - اناسی
      - اسی
      - اکیاسی
      - بیاسی
      - تراسی
      - چوراسی
      - پچاسی
      - چھیاسی
      - ستاسی
      - اٹھاسی
      - نواسی
      - نوے
      - اکیانوے
      - بانوے
      - ترانوے
      - چورانوے
      - پچانوے
      - چھیانوے
      - ستانوے
      - اٹھانوے
      - ننانوے
    hundreds: [~, ایک سو, دو سو, تین سو, چار سو, پانچ سو, چھ سو, سات سو, آٹھ سو, نو سو]
    # 10^3, 10^5, 10^7, 10^9 and 10^11; the last one repeats for larger numbers.
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # Below a hundred each number is one word; the counts of the scale words go up to 99, and the last scale word
    # counts any number.
    rules:
      cardinal:
        0: '{ones}'
        100: '{hundreds}[ {>}]'
        1000: '{ones} {thousand}[ {>}]'
        100000: '{ones} {lakh}[ {>}]'
        10000000: '{ones} {crore}[ {>}]'
        1000000000: '{ones} {arab}[ {>}]'
        100000000000: '{<cardinal} {kharab}[ {>}]'
      # Ordinals are irregular words or the cardinal with a suffix.
      ordinal:
        0: '{=cardinal}{ordinals.suffix}'
        1: '{ordinals.irregular}'
        5: '{=cardinal}{ordinals.suffix}'
        6: '{ordinals.irregular}'
        7: '{=cardinal}{ordinals.suffix}'
        9: '{ordinals.irregular}'
        10: '{=cardinal}{ordinals.suffix}'
    thousand: ہزار
    lakh: لاکھ
    crore: کروڑ
    arab: ارب
    kharab: کھرب
    ordinals:
      irregular: [~, پہلا, دوسرا, تیسرا, چوتھا, ~, چھٹا, ~, ~, نواں]
      suffix: واں
    # The feminine ordinals.
    genders:
      female:
        ordinals:
          irregular: [~, پہلی, دوسری, تیسری, چوتھی, ~, چھٹی, ~, ~, نویں]
          suffix: ویں
    micro_separator: اعشاریہ
