# Swiss French is French (numbers.fr.yml) with septante, huitante and nonante, which follow the rules of the other
# tens ("septante et un", "huitante-deux"), so the French rules for 70 to 99 are dropped.
fr-CH:
  numbers:
    extends: fr
    tens: [_, dix, vingt, trente, quarante, cinquante, soixante, septante, huitante, nonante]
    eighty: huitante
    rules:
      cardinal:
        70: ~
        80: ~
        90: ~
      thousands-count:
        80: ~
      ordinal:
        70: ~
        80: ~
        90: ~
    ordinals:
      tens: [_, dixième, vingtième, trentième, quarantième, cinquantième, soixantième, septantième, huitantième, nonantième]
