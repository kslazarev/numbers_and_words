# British English is English (numbers.en.yml) with hundreds_with_union: true by default ("one hundred and one"),
# which also says "and" before a last group below a hundred after a scale word ("one thousand and one").
en-GB:
  numbers:
    extends: en
    supported_options:
      # Decimals read with point by default in 1.x too, unlike English.
      fraction: true
      hundreds_with_union: {default: true, legacy_default: false}
    options:
      hundreds_with_union:
        before_last: ' and '
