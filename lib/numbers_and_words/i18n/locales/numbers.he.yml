he:
  numbers:
    supported_options:
      gender: {values: [male, female], default: female}
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
    minus: מינוס
    ones:
      female: [אפס, אחת, שתיים, שלוש, ארבע, חמש, שש, שבע, שמונה, תשע, עשר]
      male: [אפס, אחד, שניים, שלושה, ארבעה, חמישה, שישה, שבעה, שמונה, תשעה, עשרה]
    teens:
      female: [_, אחת עשרה, שתים עשרה, שלוש עשרה, ארבע עשרה, חמש עשרה, שש עשרה, שבע עשרה, שמונה עשרה, תשע עשרה]
      male: [_, אחד עשר, שנים עשר, שלושה עשר, ארבעה עשר, חמישה עשר, שישה עשר, שבעה עשר, שמונה עשר, תשעה עשר]
    tens: [_, _, עשרים, שלושים, ארבעים, חמישים, שישים, שבעים, שמונים, תשעים]
    hundreds: [_, מאה, מאתיים, שלוש מאות, ארבע מאות, חמש מאות, שש מאות, שבע מאות, שמונה מאות, תשע מאות]
    thousands: [_, אלף, אלפיים, שלושת אלפים, ארבעת אלפים, חמשת אלפים, ששת אלפים, שבעת אלפים, שמונת אלפים, תשעת אלפים, עשרת אלפים]
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # "ו" joins the last word of a group ("מאה עשרים ואחת"), and a last group of one word after a scale word
    # ("אלף ומאה", "מיליון ואלפיים"); a scale word counts in the masculine.
    rules:
      cardinal-female:
        0: '{ones.female}'
        11: '{teens.female%}'
        20: '[{tens} {union}{ones.female%}|{tens}]'
        100: '{hundreds}[{>and-female}]'
        1000: '{thousands}[{>after-female}]'
        '11000/1000': '{<cardinal-male} {thousand}[{>after-female}]'
        1000000: '{millions}[{>after-female}]'
        2000000: '{two} {millions}[{>after-female}]'
        '3000000/1000000': '{<cardinal-male} {millions}[{>after-female}]'
        1000000000: '{billions}[{>after-female}]'
        2000000000: '{two} {billions}[{>after-female}]'
        '3000000000/1000000000': '{<cardinal-male} {billions}[{>after-female}]'
        1000000000000: '{trillions}[{>after-female}]'
        2000000000000: '{two} {trillions}[{>after-female}]'
        '3000000000000/1000000000000': '{<cardinal-male} {trillions}[{>after-female}]'
        1000000000000000: '{quadrillions}[{>after-female}]'
        2000000000000000: '{two} {quadrillions}[{>after-female}]'
        '3000000000000000/1000000000000000': '{<cardinal-male} {quadrillions}[{>after-female}]'
        1000000000000000000: '{quintillions}[{>after-female}]'
        2000000000000000000: '{two} {quintillions}[{>after-female}]'
        '3000000000000000000/1000000000000000000': '{<cardinal-male} {quintillions}[{>after-female}]'
        1000000000000000000000: '{sextillions}[{>after-female}]'
        2000000000000000000000: '{two} {sextillions}[{>after-female}]'
        '3000000000000000000000/1000000000000000000000': '{<cardinal-male} {sextillions}[{>after-female}]'
        1000000000000000000000000: '{septillions}[{>after-female}]'
        2000000000000000000000000: '{two} {septillions}[{>after-female}]'
        '3000000000000000000000000/1000000000000000000000000': '{<cardinal-male} {septillions}[{>after-female}]'
        1000000000000000000000000000: '{octillions}[{>after-female}]'
        2000000000000000000000000000: '{two} {octillions}[{>after-female}]'
        '3000000000000000000000000000/1000000000000000000000000000': '{<cardinal-male} {octillions}[{>after-female}]'
        1000000000000000000000000000000: '{nonillions}[{>after-female}]'
        2000000000000000000000000000000: '{two} {nonillions}[{>after-female}]'
        '3000000000000000000000000000000/1000000000000000000000000000000': '{<cardinal-male} {nonillions}[{>after-female}]'
        1000000000000000000000000000000000: '{decillions}[{>after-female}]'
        2000000000000000000000000000000000: '{two} {decillions}[{>after-female}]'
        '3000000000000000000000000000000000/1000000000000000000000000000000000': '{<cardinal-male} {decillions}[{>after-female}]'
      and-female:
        then: cardinal-female
        1: ' {union}{=}'
        20: '[ {=}| {union}{=}]'
      after-female:
        extends: and-female
        100: '[ {=}| {union}{=}]'
        '1000*1000': '[ {=}| {union}{=}]'
      cardinal-male:
        0: '{ones.male}'
        11: '{teens.male%}'
        20: '[{tens} {union}{ones.male%}|{tens}]'
        100: '{hundreds}[{>and-male}]'
        1000: '{thousands}[{>after-male}]'
        '11000/1000': '{<cardinal-male} {thousand}[{>after-male}]'
        1000000: '{millions}[{>after-male}]'
        2000000: '{two} {millions}[{>after-male}]'
        '3000000/1000000': '{<cardinal-male} {millions}[{>after-male}]'
        1000000000: '{billions}[{>after-male}]'
        2000000000: '{two} {billions}[{>after-male}]'
        '3000000000/1000000000': '{<cardinal-male} {billions}[{>after-male}]'
        1000000000000: '{trillions}[{>after-male}]'
        2000000000000: '{two} {trillions}[{>after-male}]'
        '3000000000000/1000000000000': '{<cardinal-male} {trillions}[{>after-male}]'
        1000000000000000: '{quadrillions}[{>after-male}]'
        2000000000000000: '{two} {quadrillions}[{>after-male}]'
        '3000000000000000/1000000000000000': '{<cardinal-male} {quadrillions}[{>after-male}]'
        1000000000000000000: '{quintillions}[{>after-male}]'
        2000000000000000000: '{two} {quintillions}[{>after-male}]'
        '3000000000000000000/1000000000000000000': '{<cardinal-male} {quintillions}[{>after-male}]'
        1000000000000000000000: '{sextillions}[{>after-male}]'
        2000000000000000000000: '{two} {sextillions}[{>after-male}]'
        '3000000000000000000000/1000000000000000000000': '{<cardinal-male} {sextillions}[{>after-male}]'
        1000000000000000000000000: '{septillions}[{>after-male}]'
        2000000000000000000000000: '{two} {septillions}[{>after-male}]'
        '3000000000000000000000000/1000000000000000000000000': '{<cardinal-male} {septillions}[{>after-male}]'
        1000000000000000000000000000: '{octillions}[{>after-male}]'
        2000000000000000000000000000: '{two} {octillions}[{>after-male}]'
        '3000000000000000000000000000/1000000000000000000000000000': '{<cardinal-male} {octillions}[{>after-male}]'
        1000000000000000000000000000000: '{nonillions}[{>after-male}]'
        2000000000000000000000000000000: '{two} {nonillions}[{>after-male}]'
        '3000000000000000000000000000000/1000000000000000000000000000000': '{<cardinal-male} {nonillions}[{>after-male}]'
        1000000000000000000000000000000000: '{decillions}[{>after-male}]'
        2000000000000000000000000000000000: '{two} {decillions}[{>after-male}]'
        '3000000000000000000000000000000000/1000000000000000000000000000000000': '{<cardinal-male} {decillions}[{>after-male}]'
      and-male:
        then: cardinal-male
        1: ' {union}{=}'
        20: '[ {=}| {union}{=}]'
      after-male:
        extends: and-male
        100: '[ {=}| {union}{=}]'
        '1000*1000': '[ {=}| {union}{=}]'
      # One to ten have ordinals of their own; larger ordinals take the definite article (see Languages::He).
      ordinal:
        1: '{ordinals.ones}'
    mega: [_, thousand, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousand: אלף
    millions: מיליון
    billions: מיליארד
    trillions: טריליון
    quadrillions: קוודריליון
    quintillions: קווינטיליון
    sextillions: סקסטיליון
    septillions: ספטיליון
    octillions: אוקטיליון
    nonillions: נוניליון
    decillions: דסיליון
    two: שני
    union: ו
    definite: ה
    ordinals:
      ones: [_, ראשון, שני, שלישי, רביעי, חמישי, שישי, שביעי, שמיני, תשיעי, עשירי]
    # The feminine ordinals.
    genders:
      female:
        ordinals:
          ones: [_, ראשונה, שנייה, שלישית, רביעית, חמישית, שישית, שביעית, שמינית, תשיעית, עשירית]
    micro_separator: נקודה
    subunit_separator: ו
    subunit_separator_attached: true
    # One follows its unit (שקל אחד) and two takes its construct form before it (שני שקלים, שתי אגורות).
    unit_order:
      after: [1]
    before_unit:
      whole:
        שניים: שני
        שתיים: שתי
