ro:
  numbers:
    # The plural category of a count (see NumbersAndWords::I18n::PluralRule); any other count is other.
    plural:
      one: 'n = 1'
      few: 'n = 0 or n % 100 = 1..19'
    supported_options:
      gender: {values: [male, female, neuter], default: male}
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
    minus: minus
    ones:
      male: [zero, unu, doi, trei, patru, cinci, șase, șapte, opt, nouă]
      female: [zero, una, două, trei, patru, cinci, șase, șapte, opt, nouă]
      neuter: [zero, unu, două, trei, patru, cinci, șase, șapte, opt, nouă]
    teens:
      male: [zece, unsprezece, doisprezece, treisprezece, paisprezece, cincisprezece, șaisprezece, șaptesprezece, optsprezece, nouăsprezece]
      female: [zece, unsprezece, douăsprezece, treisprezece, paisprezece, cincisprezece, șaisprezece, șaptesprezece, optsprezece, nouăsprezece]
      neuter: [zece, unsprezece, douăsprezece, treisprezece, paisprezece, cincisprezece, șaisprezece, șaptesprezece, optsprezece, nouăsprezece]
    tens: [_, _, douăzeci, treizeci, patruzeci, cincizeci, șaizeci, șaptezeci, optzeci, nouăzeci]
    union: și
    of: de
    hundred_one: o sută
    hundreds_many: sute
    one:
      female: o
      neuter: un
    thousand: mie
    thousands: mii
    million: milion
    millions: milioane
    billion: miliard
    billions: miliarde
    trillion: bilion
    trillions: bilioane
    quadrillion: biliard
    quadrillions: biliarde
    quintillion: trilion
    quintillions: trilioane
    sextillion: triliard
    sextillions: triliarde
    septillion: cvadrilion
    septillions: cvadrilioane
    octillion: cvadriliard
    octillions: cvadriliarde
    nonillion: cvintilion
    nonillions: cvintilioane
    decillion: cvintiliard
    decillions: cvintiliarde
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # A scale word counts in the feminine (mie) or the neuter (the others), with "de" after a count whose last two
    # digits are zero or 20 or more ("douăzeci de mii", "o sută de mii", but "două mii", "o sută una mii").
    # How decimals are read (see Decorators.readings) and the genders of their parts (see RuleSets#decimal_gender).
    decimals: {reading: point_words, fractional_gender: male}
    rules:
      cardinal-male:
        0: '{ones.male}'
        10: '{teens.male%}'
        20: '[{tens} {union} {ones.male%}|{tens}]'
        100: '{hundred_one}[ {>}]'
        200: '{ones.female} {hundreds_many}[ {>}]'
        1000: '{one.female} {thousand}[ {>}]'
        2000: '{<count-female} {thousands}[ {>}]'
        1000000: '{one.neuter} {million}[ {>}]'
        2000000: '{<count-neuter} {millions}[ {>}]'
        1000000000: '{one.neuter} {billion}[ {>}]'
        2000000000: '{<count-neuter} {billions}[ {>}]'
        1000000000000: '{one.neuter} {trillion}[ {>}]'
        2000000000000: '{<count-neuter} {trillions}[ {>}]'
        1000000000000000: '{one.neuter} {quadrillion}[ {>}]'
        2000000000000000: '{<count-neuter} {quadrillions}[ {>}]'
        1000000000000000000: '{one.neuter} {quintillion}[ {>}]'
        2000000000000000000: '{<count-neuter} {quintillions}[ {>}]'
        1000000000000000000000: '{one.neuter} {sextillion}[ {>}]'
        2000000000000000000000: '{<count-neuter} {sextillions}[ {>}]'
        1000000000000000000000000: '{one.neuter} {septillion}[ {>}]'
        2000000000000000000000000: '{<count-neuter} {septillions}[ {>}]'
        1000000000000000000000000000: '{one.neuter} {octillion}[ {>}]'
        2000000000000000000000000000: '{<count-neuter} {octillions}[ {>}]'
        1000000000000000000000000000000: '{one.neuter} {nonillion}[ {>}]'
        2000000000000000000000000000000: '{<count-neuter} {nonillions}[ {>}]'
        1000000000000000000000000000000000: '{one.neuter} {decillion}[ {>}]'
        2000000000000000000000000000000000: '{<count-neuter} {decillions}[ {>}]'
      cardinal-female:
        extends: cardinal-male
        0: '{ones.female}'
        10: '{teens.female%}'
        20: '[{tens} {union} {ones.female%}|{tens}]'
      cardinal-neuter:
        extends: cardinal-male
        0: '{ones.neuter}'
        10: '{teens.neuter%}'
        20: '[{tens} {union} {ones.neuter%}|{tens}]'
      count-female:
        0: '{ones.female}'
        10: '{teens.female%}'
        20: '[{tens} {union} {ones.female%} {of}|{tens} {of}]'
        100: '[{hundred_one} {>}|{hundred_one} {of}]'
        200: '[{ones.female} {hundreds_many} {>}|{ones.female} {hundreds_many} {of}]'
      count-neuter:
        0: '{ones.neuter}'
        10: '{teens.neuter%}'
        20: '[{tens} {union} {ones.neuter%} {of}|{tens} {of}]'
        100: '[{hundred_one} {>}|{hundred_one} {of}]'
        200: '[{ones.female} {hundreds_many} {>}|{ones.female} {hundreds_many} {of}]'
      # An ordinal is "primul" or "prima", or an article and words whose last one is ordinal ("al doilea", "a doua"),
      # leaving out un before a single scale word ("al milionulea").
      ordinal:
        0: '{ones.male}'
        1: '{ordinals.first}'
        2: '{ordinals.article} {=ordinal-words}'
      ordinal-words:
        0: '{ordinals.ones}'
        10: '{ordinals.teens%}'
        20: '[{tens} {union} {ordinals.ones%}|{ordinals.tens}]'
        100: '[{hundred_one} {>ordinal-words}|{ordinals.hundred_one}]'
        200: '[{ones.female} {hundreds_many} {>ordinal-words}|{ones.female} {ordinals.hundreds_many}]'
        1000: '[{one.female} {thousand} {>ordinal-inner}|{one.female} {ordinals.thousand}]'
        2000: '[{<count-female} {thousands} {>ordinal-inner}|{<count-female} {ordinals.thousands}]'
        1000000: '[{one.neuter} {million} {>ordinal-inner}|{ordinals.million}]'
        2000000: '[{<count-neuter} {millions} {>ordinal-inner}|{<count-neuter} {ordinals.millions}]'
        1000000000: '[{one.neuter} {billion} {>ordinal-inner}|{ordinals.billion}]'
        2000000000: '[{<count-neuter} {billions} {>ordinal-inner}|{<count-neuter} {ordinals.billions}]'
        1000000000000: '[{one.neuter} {trillion} {>ordinal-inner}|{ordinals.trillion}]'
        2000000000000: '[{<count-neuter} {trillions} {>ordinal-inner}|{<count-neuter} {ordinals.trillions}]'
        1000000000000000: '[{one.neuter} {quadrillion} {>ordinal-inner}|{ordinals.quadrillion}]'
        2000000000000000: '[{<count-neuter} {quadrillions} {>ordinal-inner}|{<count-neuter} {ordinals.quadrillions}]'
        1000000000000000000: '[{one.neuter} {quintillion} {>ordinal-inner}|{ordinals.quintillion}]'
        2000000000000000000: '[{<count-neuter} {quintillions} {>ordinal-inner}|{<count-neuter} {ordinals.quintillions}]'
        1000000000000000000000: '[{one.neuter} {sextillion} {>ordinal-inner}|{ordinals.sextillion}]'
        2000000000000000000000: '[{<count-neuter} {sextillions} {>ordinal-inner}|{<count-neuter} {ordinals.sextillions}]'
        1000000000000000000000000: '[{one.neuter} {septillion} {>ordinal-inner}|{ordinals.septillion}]'
        2000000000000000000000000: '[{<count-neuter} {septillions} {>ordinal-inner}|{<count-neuter} {ordinals.septillions}]'
        1000000000000000000000000000: '[{one.neuter} {octillion} {>ordinal-inner}|{ordinals.octillion}]'
        2000000000000000000000000000: '[{<count-neuter} {octillions} {>ordinal-inner}|{<count-neuter} {ordinals.octillions}]'
        1000000000000000000000000000000: '[{one.neuter} {nonillion} {>ordinal-inner}|{ordinals.nonillion}]'
        2000000000000000000000000000000: '[{<count-neuter} {nonillions} {>ordinal-inner}|{<count-neuter} {ordinals.nonillions}]'
        1000000000000000000000000000000000: '[{one.neuter} {decillion} {>ordinal-inner}|{ordinals.decillion}]'
        2000000000000000000000000000000000: '[{<count-neuter} {decillions} {>ordinal-inner}|{<count-neuter} {ordinals.decillions}]'
      ordinal-inner:
        extends: ordinal-words
        1000000: '[{one.neuter} {million} {>ordinal-inner}|{one.neuter} {ordinals.million}]'
        1000000000: '[{one.neuter} {billion} {>ordinal-inner}|{one.neuter} {ordinals.billion}]'
        1000000000000: '[{one.neuter} {trillion} {>ordinal-inner}|{one.neuter} {ordinals.trillion}]'
        1000000000000000: '[{one.neuter} {quadrillion} {>ordinal-inner}|{one.neuter} {ordinals.quadrillion}]'
        1000000000000000000: '[{one.neuter} {quintillion} {>ordinal-inner}|{one.neuter} {ordinals.quintillion}]'
        1000000000000000000000: '[{one.neuter} {sextillion} {>ordinal-inner}|{one.neuter} {ordinals.sextillion}]'
        1000000000000000000000000: '[{one.neuter} {septillion} {>ordinal-inner}|{one.neuter} {ordinals.septillion}]'
        1000000000000000000000000000: '[{one.neuter} {octillion} {>ordinal-inner}|{one.neuter} {ordinals.octillion}]'
        1000000000000000000000000000000: '[{one.neuter} {nonillion} {>ordinal-inner}|{one.neuter} {ordinals.nonillion}]'
        1000000000000000000000000000000000: '[{one.neuter} {decillion} {>ordinal-inner}|{one.neuter} {ordinals.decillion}]'
    mega: [_, mie, milion, miliard, bilion, biliard, trilion, triliard, cvadrilion, cvadriliard, cvintilion, cvintiliard]
    ordinals:
      article: al
      first: primul
      ones: [_, unulea, doilea, treilea, patrulea, cincilea, șaselea, șaptelea, optulea, nouălea]
      teens: [zecelea, unsprezecelea, doisprezecelea, treisprezecelea, paisprezecelea, cincisprezecelea, șaisprezecelea, șaptesprezecelea, optsprezecelea, nouăsprezecelea]
      tens: [_, _, douăzecilea, treizecilea, patruzecilea, cincizecilea, șaizecilea, șaptezecilea, optzecilea, nouăzecilea]
      hundred_one: o sutălea
      hundreds_many: sutelea
      thousand: miilea
      thousands: miilea
      million: milionulea
      millions: milioanelea
      billion: miliardulea
      billions: miliardelea
      trillion: bilionulea
      trillions: bilioanelea
      quadrillion: biliardulea
      quadrillions: biliardelea
      quintillion: trilionulea
      quintillions: trilioanelea
      sextillion: triliardulea
      sextillions: triliardelea
      septillion: cvadrilionulea
      septillions: cvadrilioanelea
      octillion: cvadriliardulea
      octillions: cvadriliardelea
      nonillion: cvintilionulea
      nonillions: cvintilioanelea
      decillion: cvintiliardulea
      decillions: cvintiliardelea
    # The feminine ordinals.
    genders:
      female:
        ordinals:
          article: a
          first: prima
          ones: [_, una, doua, treia, patra, cincea, șasea, șaptea, opta, noua]
          teens: [zecea, unsprezecea, douăsprezecea, treisprezecea, paisprezecea, cincisprezecea, șaisprezecea, șaptesprezecea, optsprezecea, nouăsprezecea]
          tens: [_, _, douăzecea, treizecea, patruzecea, cincizecea, șaizecea, șaptezecea, optzecea, nouăzecea]
          hundred_one: o suta
          hundreds_many: suta
          thousand: mia
          thousands: mia
          million: milioana
          millions: milioana
          billion: miliarda
          billions: miliarda
          trillion: bilioana
          trillions: bilioana
          quadrillion: biliarda
          quadrillions: biliarda
          quintillion: trilioana
          quintillions: trilioana
          sextillion: triliarda
          sextillions: triliarda
          septillion: cvadrilioana
          septillions: cvadrilioana
          octillion: cvadriliarda
          octillions: cvadriliarda
          nonillion: cvintilioana
          nonillions: cvintilioana
          decillion: cvintiliarda
          decillions: cvintiliarda
    micro_separator: virgulă
    subunit_separator: și
    # The form of a unit after a decimal: the few form, without "de" ("virgulă cinci lei").
    unit_after_decimal: {form: few}
    # Before a unit, one is "un", or "o" before a feminine unit (un leu, o liră); compounds keep "unu" and "una".
    before_unit:
      whole:
        unu: un
        una: o
