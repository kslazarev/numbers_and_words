ro:
  numbers:
    ones:
      male: [zero, unu, doi, trei, patru, cinci, șase, șapte, opt, nouă]
      female: [zero, una, două, trei, patru, cinci, șase, șapte, opt, nouă]
    teens:
      male: [zece, unsprezece, doisprezece, treisprezece, paisprezece, cincisprezece, șaisprezece, șaptesprezece, optsprezece, nouăsprezece]
      female: [zece, unsprezece, douăsprezece, treisprezece, paisprezece, cincisprezece, șaisprezece, șaptesprezece, optsprezece, nouăsprezece]
    tens: [_, _, douăzeci, treizeci, patruzeci, cincizeci, șaizeci, șaptezeci, optzeci, nouăzeci]
    union: și
    of: de
    hundred: [o sută, sute]
    # The article "o" or "un" counts one of a feminine or neuter noun.
    one:
      female: o
      neuter: un
    mega: [_, mie, milion, miliard, bilion, biliard]
    mega_plural: [_, mii, milioane, miliarde, bilioane, biliarde]
    ordinals:
      article:
        male: al
        female: a
      first:
        male: primul
        female: prima
      male_suffix: lea
      male_consonant_suffix: ulea
      # Feminine ordinals of nouns: a doua suta, a doua mia, a milioana.
      female_nouns:
        sută: suta
        sute: suta
        mie: mia
        mii: mia
        milion: milioana
        milioane: milioana
        miliard: miliarda
        miliarde: miliarda
        bilion: bilioana
        bilioane: bilioana
        biliard: biliarda
        biliarde: biliarda
    micro_separator: virgulă
    subunit_separator: și
