fr:
  numbers:
    supported_options:
      fraction: true
      ordinal: true
      remove_zero: {keeps_micro_separator: true}
      spelling: {values: [reformed, traditional]}
    minus: moins
    ones: [zéro, un, deux, trois, quatre, cinq, six, sept, huit, neuf]
    teens: [_, onze, douze, treize, quatorze, quinze, seize, dix-sept, dix-huit, dix-neuf]
    tens: [_, dix, vingt, trente, quarante, cinquante, soixante, soixante-dix, quatre-vingt, quatre-vingt-dix]
    eighty: quatre-vingts
    hundreds:
      one: cent
      other: cents
    hundred: cent
    sixty: soixante
    eighty_count: quatre-vingt
    # The separator inside a group and around mille: a hyphen in the reformed spelling, a space in the traditional one.
    sp: '-'
    # Rule sets for whole numbers (see NumbersAndWords::Rules): the key is the smallest number a rule applies to.
    # How decimals are read (see Decorators.readings).
    decimals: {reading: point_or_fraction}
    rules:
      cardinal:
        0: '{ones}'
        10: '{tens}'
        11: '{teens%}'
        20: '{tens}[{>and-one}]'
        70: '[{sixty}{>seventy}|{tens}]'
        80: '[{eighty_count}-{>}|{eighty}]'
        90: '[{eighty_count}-{teens%}|{tens}]'
        100: '{hundred}[{sp}{>}]'
        200: '[{ones}{sp}{hundred}{sp}{>}|{ones}{sp}{hundreds}]'
        1000: '{thousands}[{sp}{>}]'
        2000: '{<thousands-count}{sp}{thousands}[{sp}{>}]'
        1000000: '{<cardinal} {millions}[ {>}]'
        1000000000: '{<cardinal} {billions}[ {>}]'
        1000000000000: '{<cardinal} {trillions}[ {>}]'
        1000000000000000: '{<cardinal} {quadrillions}[ {>}]'
        1000000000000000000: '{<cardinal} {quintillions}[ {>}]'
        1000000000000000000000: '{<cardinal} {sextillions}[ {>}]'
        1000000000000000000000000: '{<cardinal} {septillions}[ {>}]'
        1000000000000000000000000000: '{<cardinal} {octillions}[ {>}]'
        1000000000000000000000000000000: '{<cardinal} {nonillions}[ {>}]'
        1000000000000000000000000000000000: '{<cardinal} {decillions}[ {>}]'
      # "Et" before a final un ("vingt et un"), a hyphen otherwise ("vingt-deux").
      and-one:
        1: '{sp}{union}{sp}{ones}'
        2: '-{ones}'
      seventy:
        1: '{sp}{union}{sp}{teens}'
        2: '-{teens}'
      # Cent and quatre-vingt take no s before mille ("deux cent mille", "quatre-vingt mille").
      thousands-count:
        extends: cardinal
        80: '[{eighty_count}-{>}|{eighty_count}]'
        200: '{ones}{sp}{hundred}[{sp}{>}]'
      # The last word of an ordinal is ordinal; a lone un is "premier", and a leading un before a single scale word
      # is left out ("millionième").
      ordinal:
        0: '{ordinals.ones}'
        1: '{ordinal_first}'
        2: '{ordinals.ones}'
        10: '{ordinals.tens}'
        11: '{ordinals.teens%}'
        20: '[{tens}{>ordinal-and-one}|{ordinals.tens}]'
        70: '[{sixty}{>ordinal-seventy}|{ordinals.tens}]'
        80: '[{eighty_count}-{>ordinal-inner}|{ordinals.tens}]'
        90: '[{eighty_count}-{ordinals.teens%}|{ordinals.tens}]'
        100: '[{hundred}{sp}{>ordinal-inner}|{ordinals.hundred}]'
        200: '[{ones}{sp}{hundred}{sp}{>ordinal-inner}|{ones}{sp}{ordinals.hundred}]'
        1000: '[{thousands}{sp}{>ordinal-inner}|{ordinals.thousands}]'
        2000: '[{<thousands-count}{sp}{thousands}{sp}{>ordinal-inner}|{<thousands-count}{sp}{ordinals.thousands}]'
        1000000: '[{<cardinal} {millions} {>ordinal-inner}|{ordinals.millions}]'
        2000000: '[{<cardinal} {millions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.millions}]'
        1000000000: '[{<cardinal} {billions} {>ordinal-inner}|{ordinals.billions}]'
        2000000000: '[{<cardinal} {billions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.billions}]'
        1000000000000: '[{<cardinal} {trillions} {>ordinal-inner}|{ordinals.trillions}]'
        2000000000000: '[{<cardinal} {trillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.trillions}]'
        1000000000000000: '[{<cardinal} {quadrillions} {>ordinal-inner}|{ordinals.quadrillions}]'
        2000000000000000: '[{<cardinal} {quadrillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.quadrillions}]'
        1000000000000000000: '[{<cardinal} {quintillions} {>ordinal-inner}|{ordinals.quintillions}]'
        2000000000000000000: '[{<cardinal} {quintillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.quintillions}]'
        1000000000000000000000: '[{<cardinal} {sextillions} {>ordinal-inner}|{ordinals.sextillions}]'
        2000000000000000000000: '[{<cardinal} {sextillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.sextillions}]'
        1000000000000000000000000: '[{<cardinal} {septillions} {>ordinal-inner}|{ordinals.septillions}]'
        2000000000000000000000000: '[{<cardinal} {septillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.septillions}]'
        1000000000000000000000000000: '[{<cardinal} {octillions} {>ordinal-inner}|{ordinals.octillions}]'
        2000000000000000000000000000: '[{<cardinal} {octillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.octillions}]'
        1000000000000000000000000000000: '[{<cardinal} {nonillions} {>ordinal-inner}|{ordinals.nonillions}]'
        2000000000000000000000000000000: '[{<cardinal} {nonillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.nonillions}]'
        1000000000000000000000000000000000: '[{<cardinal} {decillions} {>ordinal-inner}|{ordinals.decillions}]'
        2000000000000000000000000000000000: '[{<cardinal} {decillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.decillions}]'
      ordinal-inner:
        extends: ordinal
        1: '{ordinals.ones}'
        1000000: '[{<cardinal} {millions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.millions}]'
        1000000000: '[{<cardinal} {billions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.billions}]'
        1000000000000: '[{<cardinal} {trillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.trillions}]'
        1000000000000000: '[{<cardinal} {quadrillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.quadrillions}]'
        1000000000000000000: '[{<cardinal} {quintillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.quintillions}]'
        1000000000000000000000: '[{<cardinal} {sextillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.sextillions}]'
        1000000000000000000000000: '[{<cardinal} {septillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.septillions}]'
        1000000000000000000000000000: '[{<cardinal} {octillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.octillions}]'
        1000000000000000000000000000000: '[{<cardinal} {nonillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.nonillions}]'
        1000000000000000000000000000000000: '[{<cardinal} {decillions} {>ordinal-inner}|{<cardinal}{sp}{ordinals.decillions}]'
      ordinal-and-one:
        1: '{sp}{union}{sp}{ordinals.ones}'
        2: '-{ordinals.ones}'
      ordinal-seventy:
        1: '{sp}{union}{sp}{ordinals.teens}'
        2: '-{ordinals.teens}'
    mega: [_, thousands, millions, billions, trillions, quadrillions, quintillions, sextillions, septillions, octillions, nonillions, decillions]
    thousands:
      one: mille
      other: mille
    millions:
      one: million
      other: millions
    billions:
      one: milliard
      other: milliards
    trillions:
      one: billion
      other: billions
    quadrillions:
      one: billiard
      other: billiards
    quintillions:
      one: trillion
      other: trillions
    sextillions:
      one: trilliard
      other: trilliards
    septillions:
      one: quadrillion
      other: quadrillions
    octillions:
      one: quadrilliard
      other: quadrilliards
    nonillions:
      one: quintillion
      other: quintillions
    decillions:
      one: quintilliard
      other: quintilliards
    micro: [_, tenths, hundredths, thousandths, millionths, billionths, trillionths, quadrillionths, quintillionths, sextillionths, septillionths, octillionths, nonillionths, decillionths, undecillionths, duodecillionths, tredecillionths, quattuordecillionths]
    tenths:
      one: dixième
      other: dixièmes
    hundredths:
      one: centième
      other: centièmes
    thousandths:
      one: millième
      other: millièmes
    millionths:
      one: millionième
      other: millionièmes
    billionths:
      one: milliardième
      other: milliardièmes
    trillionths:
      one: billionième
      other: billionièmes
    quadrillionths:
      one: billiardième
      other: billiardièmes
    quintillionths:
      one: trillionième
      other: trillionièmes
    sextillionths:
      one: trilliardième
      other: trilliardièmes
    septillionths:
      one: quadrillionième
      other: quadrillionièmes
    octillionths:
      one: quadrilliardième
      other: quadrilliardièmes
    nonillionths:
      one: quintillionième
      other: quintillionièmes
    decillionths:
      one: quintilliardième
      other: quintilliardièmes
    undecillionths:
      one: sextillionième
      other: sextillionièmes
    duodecillionths:
      one: sextilliardième
      other: sextilliardièmes
    tredecillionths:
      one: septillionième
      other: septillionièmes
    quattuordecillionths:
      one: septilliardième
      other: septilliardièmes
    micro_separator: virgule
    subunit_separator: et
    # The form of a unit after a decimal: an amount below 2 takes the singular ("1,5 euro").
    unit_after_decimal: {below_two: one}
    # The form of a unit after zero: the singular ("zéro euro").
    unit_after_zero: one
    unit_scale_preposition: de
    unit_scale_preposition_elided: "d'"
    fraction_separator: et
    micro_prefix:
      tens: dix
      hundreds: cent
      union: '-'
    union: et
    ordinal_first: premier
    ordinals:
      ones: [zéroième, unième, deuxième, troisième, quatrième, cinquième, sixième, septième, huitième, neuvième]
      teens: [_, onzième, douzième, treizième, quatorzième, quinzième, seizième, dix-septième, dix-huitième, dix-neuvième]
      tens: [_, dixième, vingtième, trentième, quarantième, cinquantième, soixantième, soixante-dixième, quatre-vingtième, quatre-vingt-dixième]
      hundred: centième
      thousands: millième
      millions: millionième
      billions: milliardième
      trillions: billionième
      quadrillions: billiardième
      quintillions: trillionième
      sextillions: trilliardième
      septillions: quadrillionième
      octillions: quadrilliardième
      nonillions: quintillionième
      decillions: quintilliardième
    options:
      traditional:
        sp: ' '
