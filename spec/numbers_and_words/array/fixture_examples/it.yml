to_words:
  simple_example:
    ?
      - 1
      - 2
      - 3
    :
      - uno
      - due
      - tre
  complex_example:
    ?
      - 101
      - 21
      - 13
    :
      - centouno
      - ventuno
      - tredici
  complex_example_with_options:
    options:
      :remove_zero: true
    ?
      - 0.1
      - 0.31
      - 0.12
    :
      - un decimo
      - trentuno centesimi
      - dodici centesimi
