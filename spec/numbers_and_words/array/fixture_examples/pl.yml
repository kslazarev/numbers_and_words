to_words:
  simple_example:
    ? [1, 2, 3]
    : [jeden, dwa, trzy]
  complex_example:
    ? [1001, 101, 21, 13]
    : [tysiąc jeden, sto jeden, dwadzieścia jeden, trzynaście]
  fractions_without_zero:
    options:
      :remove_zero: true
    ? [0.1, 0.31, 0.12]
    : [jedna dziesiąta, trzydzieści jeden setnych, dwanaście setnych]
