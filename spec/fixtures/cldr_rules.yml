# Reviewed rules that turn the Unicode CLDR spell-out reading into this gem's
# before the two are compared (see spec/cldr_comparison_spec.rb), each for a
# known difference: a CLDR convention or error, or a variant both forms of
# which are in use. "*" holds the rules shared by several locales, with their
# arguments per locale. Rules apply in order, the shared ones first; see
# spec/support/cldr_rules.rb for the operations and scopes.
#
# ticket: names the CLDR Jira ticket that reports a CLDR error a rule works
# around, such as CLDR-19918 (https://unicode-org.atlassian.net/browse/CLDR-19918).
#
# affects: is the number of comparisons whose CLDR reading a rule changes;
# `bundle exec ruby script/cldr_differences.rb` sets it.
'*':
  - reason: CLDR says the implicit one before a scale word (one hundred, one thousand, one million); the gem omits it, as is usual
    drop_one:
      af: { one: [een], before: [honderd, duisend], kinds: [ordinal], affects: 5 }
      az: { one: [bir], before: [yüz, min, bin, milyonuncu, milyarıncı], affects: 22 }
      bg: { one: [един], before: [милионен, милионна, милионно, милиарден, милиардна, милиардно], affects: 6 }
      ca: { one: [un], before: [milionè, miliardè, milionena, miliardena], affects: 4 }
      cs: { one: [jedna], before: [tisíc], affects: 12 }
      de: { one: [eine], before: [Millionste, Milliardeste], affects: 2 }
      el: { one: [ένα], before: [εκατομμυριοστός, εκατομμυριοστή, εκατομμυριοστό, δισεκατομμυριοστός, δισεκατομμυριοστή, δισεκατομμυριοστό], affects: 6 }
      es: { one: [un], before: [millonésimo, millonésima], affects: 2 }
      et: { one: [üks], before: [sada, tuhat], affects: 10 }
      fi: { one: [yksi], before: [miljoona, miljardi], affects: 2 }
      fr: { one: [un], before: [millionième, milliardième], affects: 2 }
      hu: { one: [egy], before: [milliomodik], affects: 1 }
      hy: { one: [մեկ], before: [հարյուր, հազար], affects: 10 }
      mk: { one: [една], before: [илјада], affects: 9 }
      nl: { one: [een], before: [miljoenste, miljardste], affects: 2 }
      pt-BR: { one: [um, uma], before: [milionésimo, milionésima, bilionésimo, bilionésima], affects: 4 }
      ru: { one: [одна], before: [тысяча], kinds: [ordinal, ordinal/female, ordinal/neuter], affects: 6 }
      sk: { one: [jedna, jeden], before: [sto, tisíc, milión, miliarda], affects: 36 }
      sv: { one: [en], before: [miljonte, miljardte], affects: 2 }
      tr: { one: [bir], before: [milyonuncu, milyarıncı], affects: 2 }
pl:
  - reason: CLDR's feminine instrumental uses the masculine dwoma for a final two after tens (dwudziestoma dwoma), but dwiema for two alone; the gem uses dwiema in both, and both forms are in use
    replace_parts: { dwoma: dwiema }
    kinds: [cardinal/female/instrumental]
    below: 100
    affects: 8
af:
  - reason: CLDR adds -de to the cardinal from four to nine (sewede, agtde, negede); the Afrikaanse Woordelys en Spelreëls has sewende, agtste and negende
    replace: { sewede: sewende, agtde: agtste, negede: negende }
    affects: 3
  - reason: CLDR writes a count of hundreds apart (vier honderd) in some ordinals, but together in its cardinals and in its other ordinals (vierhonderd)
    replace: { twee honderd: tweehonderd, drie honderd: driehonderd, vier honderd: vierhonderd, vyf honderd: vyfhonderd, ses honderd: seshonderd, sewe honderd: sewehonderd, agt honderd: agthonderd, nege honderd: negehonderd }
    kinds: [ordinal]
    affects: 3
  - reason: CLDR writes the count of duisend apart in ordinals (twee duisendste) but together in cardinals below 21 000 (tweeduisend); the gem writes both together
    replace: { twee duisendste: tweeduisendste }
    kinds: [ordinal]
    affects: 1
  - reason: CLDR reads 101st with the cardinal (honderd eenste), unlike its own en eerste after duisend and miljoen (duisend en eerste); the gem says honderd en eerste
    replace: { honderd eenste: honderd en eerste }
    kinds: [ordinal]
    affects: 1
ar:
  - reason: CLDR writes the hamza (إثنان); اثنان begins with a connecting hamzat wasl and is written without it
    replace: { إثنان: اثنان, إثنا: اثنا }
    ticket: CLDR-19918
    affects: 11
  - reason: CLDR uses the feminine إحدى عشر in the masculine rule set; masculine 11 is أحد عشر
    replace_parts: { إحدى عشر: أحد عشر }
    affects: 2
  - reason: CLDR writes hundreds as two words (تسعة مائة); standard Arabic writes the compound تسعمائة
    replace_parts: { أربعة مائة: أربعمائة, سبعة مائة: سبعمائة, تسعة مائة: تسعمائة }
    affects: 3
  - reason: the gem adds the accusative tanween required after 11-99 (ألفًا, مليونًا); CLDR leaves the counted noun bare
    replace: { وعشرون ألف: وعشرون ألفًا, وعشرون مليون: وعشرون مليونًا, وخمسون ألف: وخمسون ألفًا }
    affects: 4
az:
  - reason: CLDR misspells 60 as atmış; the standard spelling is altmış
    replace: { atmış: altmış }
    ticket: CLDR-19918
    affects: 10
  - reason: CLDR misspells 80 as səqsən; the standard spelling is səksən
    replace_parts: { səqsən: səksən }
    ticket: CLDR-19918
    affects: 22
  - reason: CLDR breaks vowel harmony (yetmişıncı); front-vowel stems take -inci
    replace: { yetmişıncı: yetmişinci, səksənıncı: səksəninci }
    affects: 2
  - reason: CLDR uses the Turkish bin in Azerbaijani ordinals; Azerbaijani thousand is min
    replace: { bin: min, bininci: mininci }
    ticket: CLDR-19918
    kinds: [ordinal]
    affects: 8
be:
  - reason: CLDR uses the superseded spellings пяцьдзесят and шэсцьдзесят (and the genitive stem пяцідзясят before a final digit of an ordinal); the 2008 Belarusian orthography writes пяцьдзясят and шэсцьдзясят
    replace: { пяцьдзесят: пяцьдзясят, шэсцьдзесят: шэсцьдзясят, пяцідзясят: пяцьдзясят }
    affects: 106
  - reason: CLDR misspells the ordinal of three as трэйці, трэццяя and трэццяе; the standard forms are трэці, трэцяя and трэцяе
    replace: { трэйці: трэці, трэццяя: трэцяя, трэццяе: трэцяе }
    affects: 27
  - reason: CLDR writes the ordinal of four in the classical orthography (чацьверты); the official orthography writes чацвёрты
    replace: { чацьверты: чацвёрты, чацьвертая: чацвёртая, чацьвертае: чацвёртае }
    affects: 27
  - reason: CLDR forms the ordinal of 200 from the feminine дзве (дзвухсоты); it takes the genitive двух, as двухтысячны does
    replace: { дзвухсоты: двухсоты, дзвухсотая: двухсотая, дзвухсотае: двухсотае }
    affects: 3
  - reason: CLDR builds some ordinals of 50, 60 and 70 on the cardinal stem (шэсцьдзесяты, семдзесяты) or misspells them; they take the genitive stem with я before the stress (пяцідзясяты, шасцідзясяты, сямідзясяты)
    replace:
      шэсцьдзесяты: шасцідзясяты
      семдзесяты: сямідзясяты
      пяцідзесятая: пяцідзясятая
      шэсцідзесятая: шасцідзясятая
      семдзесятая: сямідзясятая
      пяцьдзесятае: пяцідзясятае
      шэсцідзясятае: шасцідзясятае
      сямдзясятае: сямідзясятае
    affects: 8
  - reason: CLDR's feminine and neuter rule sets spell 700 as сямсот, its masculine one as семсот; the standard form is семсот
    replace: { сямсот: семсот }
    affects: 1
bg:
  - reason: CLDR uses the colloquial contracted teens and tens (единайсет, двайсет); the gem uses the literary standard forms (единадесет, двадесет)
    replace_parts: { найсет: надесет, двайсет: двадесет, трийсет: тридесет, четиресет: четиридесет, шейсет: шестдесет }
    affects: 324
  - reason: Bulgarian joins the last element with и (хиляда и сто); CLDR omits it
    replace:
      хиляда сто: хиляда и сто
      хиляда стотен: хиляда и стотен
      хиляда стотна: хиляда и стотна
      хиляда стотно: хиляда и стотно
      сто десет: сто и десет
      сто десети: сто и десети
      сто десета: сто и десета
      сто десето: сто и десето
      сто единадесет: сто и единадесет
      сто единадесети: сто и единадесети
      сто единадесета: сто и единадесета
      сто единадесето: сто и единадесето
    affects: 18
  - reason: CLDR misspells the 200th stem as двестат-; the standard form is двестотен
    replace_parts: { двестат: двестот }
    affects: 3
  - reason: CLDR writes compound ordinals as two words (две хиляден); Bulgarian writes them as one (двехиляден, двумилионен)
    replace:
      две хиляден: двехиляден
      две хилядна: двехилядна
      две хилядно: двехилядно
      сто хиляден: стохиляден
      сто хилядна: стохилядна
      сто хилядно: стохилядно
      една хиляден: еднохиляден
      една хилядна: еднохилядна
      една хилядно: еднохилядно
      два милионен: двумилионен
      два милионна: двумилионна
      два милионно: двумилионно
      един милионен: едномилионен
      един милионна: едномилионна
      един милионно: едномилионно
    affects: 15
bs:
  - reason: CLDR spells the feminine one jedinica, a noun (the digit one); the feminine numeral is jedna
    replace: { jedinica: jedna }
    affects: 22
  - reason: CLDR says jedinica hiljada; a thousand alone is hiljadu (hiljadu sto), as in CLDR's Croatian tisuću
    drop_one: { one: [jedna], before: [hiljada] }
    affects: 9
  - reason: CLDR says jedinica hiljada; a thousand alone is hiljadu (hiljadu sto), as in CLDR's Croatian tisuću
    replace: { hiljada: hiljadu }
    above: 999
    below: 2000
    affects: 9
  - reason: CLDR uses the ekavian dve and dvesta; Bosnian is ijekavian (dvije, dvjesta)
    replace: { dve: dvije, dvesta: dvjesta }
    affects: 15
  - reason: CLDR misspells jedanaest as jedenaest and uses the colloquial šestnaest and četristo; the standard forms are jedanaest, šesnaest and četiristo
    replace: { jedenaest: jedanaest, šestnaest: šesnaest, četristo: četiristo }
    affects: 15
  - reason: CLDR keeps the genitive plural hiljada and the singular milion after two to four; they take the paucal hiljade and miliona (dvije hiljade, tri miliona)
    replace: { dvije hiljada: dvije hiljade, tri hiljada: tri hiljade, dva milion: dva miliona, tri milion: tri miliona }
    affects: 12
  - reason: CLDR says jedan miliard; the word is milijarda and feminine (jedna milijarda)
    replace: { jedan miliard: jedna milijarda }
    affects: 3
ca:
  - reason: CLDR keeps primer, segon, tercer and quart in compound ordinals (vint-i-primer, mil primer); Catalan uses them only alone and forms compounds with -è/-ena (vint-i-unè, vint-i-dosena)
    replace: { primer: unè, segon: dosè, tercer: tresè, quart: quatrè, primera: unena, segona: dosena, tercera: tresena, quarta: quatrena }
    kinds: [ordinal, ordinal/female]
    above: 4
    affects: 68
  - reason: CLDR hyphenates cent and the tens or units after it (cent-u, cent-vint-i-tres); the Institut d'Estudis Catalans hyphenates only tens and units and units and hundreds (cent vint-i-tres)
    replace_parts: { 'cent-': 'cent ' }
    affects: 20
  - reason: CLDR drops the plural -s of the hundreds before a remainder (quatre-cent cinquanta); Catalan hundreds from two hundred are plural (quatre-cents cinquanta)
    replace: { dos-cent: dos-cents, tres-cent: tres-cents, quatre-cent: quatre-cents, cinc-cent: cinc-cents, sis-cent: sis-cents, set-cent: set-cents, vuit-cent: vuit-cents, nou-cent: nou-cents }
    kinds: [cardinal, ordinal, ordinal/female]
    affects: 9
  - reason: CLDR's feminine cardinals count hundreds and thousands in the masculine (dos-cents, dos mil); Catalan hundreds and the count of mil agree with a feminine noun (dues-centes pàgines, dues mil persones, vint-i-una mil persones)
    replace: { dos-cents: dues-centes, dos-cent: dues-centes, tres-cent: tres-centes, quatre-cent: quatre-centes, cinc-cent: cinc-centes, sis-cent: sis-centes, set-cent: set-centes, vuit-cent: vuit-centes, nou-cent: nou-centes, dos mil: dues mil, vint-i-un mil: vint-i-una mil }
    kinds: [cardinal/female]
    affects: 6
cs:
  - reason: 'the gem counts with jedna (raz, dva, tři: jedna, dvě, tři), the usual Czech counting form; CLDR spellout-numbering uses the masculine jeden'
    replace: { jeden: jedna }
    kinds: [cardinal]
    below: 1000
    affects: 10
  - reason: CLDR treats tisíc as feminine (dvě tisíce, dvacet jedna tisíc); tisíc is masculine (dva tisíce, dvacet jeden tisíc)
    replace: { dvě tisíce: dva tisíce, jedna tisíc: jeden tisíc }
    affects: 8
  - reason: CLDR spells milión; the gem uses the standard milion (both are accepted)
    replace_parts: { milión: milion }
    affects: 16
  - reason: the gem makes the noun agree with the last numeral (sto dvacet tři tisíce); CLDR uses the genitive plural tisíc, also accepted
    replace: { tři tisíc: tři tisíce }
    affects: 4
  - reason: the gem keeps the noun after the last numeral (dvacet jeden milion, sto dvacet tři miliony); CLDR uses the genitive plural miliónů, also accepted
    replace: { jeden milionů: jeden milion, tři milionů: tři miliony }
    affects: 8
  - reason: CLDR says jeden miliarda; miliarda is feminine (jedna miliarda)
    replace: { jeden miliarda: jedna miliarda }
    affects: 4
da:
  - reason: CLDR doubles the ordinal ending (hundredede, tusindee); the ordinals are hundrede and tusinde
    replace: { hundredede: hundrede, tusindee: tusinde }
    affects: 7
  - reason: CLDR shortens the 40s ordinal to fyrrende; the standard ordinal is fyrretyvende
    replace_parts: { fyrrende: fyrretyvende }
    ticket: CLDR-19918
    affects: 20
  - reason: CLDR builds ordinals with et (etogtyvende); Danish says enogtyvende
    replace_parts: { etog: enog }
    kinds: [ordinal, ordinal/neuter]
    affects: 6
  - reason: CLDR uses tusinde in cardinals; tusind is the usual cardinal form and tusinde the ordinal
    replace: { tusinde: tusind }
    kinds: [cardinal]
    affects: 8
  - reason: CLDR writes hundreds closed (firehundrede); the gem writes them open (fire hundrede); both are accepted
    split_before: [hundrede]
    affects: 10
  - reason: the gem says et hundrede and et tusind; CLDR omits et, which is also usual
    prefix: 'et '
    before: [hundrede, tusind]
    kinds: [cardinal, cardinal/neuter]
    affects: 20
  - reason: the gem says et hundrede and et tusind; CLDR omits et, which is also usual
    prefix: 'et '
    before: [hundrede, tusind]
    kinds: [ordinal, ordinal/neuter]
    above: 100
    affects: 14
  - reason: the gem says et hundrede and et tusind; CLDR omits et, which is also usual
    replace: { tusind hundrede: tusind et hundrede }
    affects: 3
  - reason: CLDR omits en before million and milliard; Danish says en million
    prefix: 'en '
    before: [million, milliard]
    kinds: [cardinal]
    affects: 2
de:
  - reason: CLDR writes million ordinals as capitalized separate nouns (eine Millionste, zwei Millionenste); German ordinals are one lowercase word (millionste, zweimillionste)
    replace: { Millionste: millionste, Millionenste: millionste, Milliardeste: milliardste, Millionen: millionen }
    kinds: [ordinal]
    affects: 5
  - reason: CLDR writes million ordinals as capitalized separate nouns (eine Millionste, zwei Millionenste); German ordinals are one lowercase word (millionste, zweimillionste)
    join_before: [millionste, millionen]
    kinds: [ordinal]
    affects: 3
  - reason: CLDR writes million ordinals as capitalized separate nouns (eine Millionste, zwei Millionenste); German ordinals are one lowercase word (millionste, zweimillionste)
    join_after: [millionen]
    kinds: [ordinal]
    affects: 1
el:
  - reason: CLDR misspells the 90s as εννενήντα, εννενηκοστό; the standard spelling is ενενήντα, ενενηκοστό
    replace_parts: { εννενήντα: ενενήντα, εννενηκοστ: ενενηκοστ }
    affects: 66
  - reason: CLDR puts two accents on χίλιάδες; the word is χιλιάδες
    replace: { χίλιάδες: χιλιάδες }
    affects: 15
  - reason: CLDR spells the neuter 8th όγδο; the neuter of όγδοος is όγδοο
    replace: { όγδο: όγδοο }
    kinds: [ordinal]
    affects: 10
  - reason: the gem uses εννιακοσιοστός, CLDR the learned εννεακοσιοστός; both are in use
    replace_parts: { εννεακοσιοστ: εννιακοσιοστ }
    affects: 3
  - reason: CLDR misspells the feminine 400th τρετρακοσιοστή; the word is τετρακοσιοστή
    replace: { τρετρακοσιοστή: τετρακοσιοστή }
    affects: 1
  - reason: CLDR leaves δεκατρεις unaccented; the word is δεκατρείς
    replace: { δεκατρεις: δεκατρείς }
    affects: 2
  - reason: the gem reads the zero ordinal as the cardinal μηδέν, as its fixtures specify; CLDR forms the adjective μηδενικός
    replace: { μηδενικό: μηδέν, μηδενικός: μηδέν, μηδενική: μηδέν }
    affects: 3
eo:
  - reason: CLDR reads zero as the noun nulo; the numeral is nul (Plena Manlibro de Esperanta Gramatiko), and its ordinal nula
    replace: { nulo: nul, nuloa: nula }
    affects: 2
  - reason: CLDR writes an ordinal of several words with spaces (dudek unua); the gem joins them with hyphens (dudek-unua), as Esperanto usually writes compound ordinals
    hyphenate: []
    kinds: [ordinal]
    affects: 94
  - reason: CLDR adds -a to a final scale noun (milionoa, du milionoja); its ordinal adjective replaces the noun ending -o with -a (miliona, du-miliona)
    replace_parts: { milionoja: miliona, milionoa: miliona, miliardoja: miliarda, miliardoa: miliarda }
    kinds: [ordinal]
    affects: 4
es:
  - reason: the gem uses undécimo and duodécimo, CLDR decimoprimero and decimosegundo; the RAE accepts both
    replace: { decimoprimero: undécimo, decimosegundo: duodécimo, decimoprimera: undécima, decimosegunda: duodécima }
    affects: 6
  - reason: the gem writes compound ordinals of mil and millón as one word, as the RAE recommends (dosmilésimo, veintiunmilésimo, cienmilésimo); CLDR writes them apart
    join_before: [milésim, millonésim]
    affects: 16
  - reason: the gem writes compound ordinals of mil and millón as one word, as the RAE recommends (dosmilésimo, veintiunmilésimo, cienmilésimo); CLDR writes them apart
    replace_parts: { veintiúnmil: veintiunmil }
    affects: 4
fi:
  - reason: the gem uses yhdes for a final 1 inside compound ordinals (kahdeskymmenesyhdes miljoonas); CLDR uses ensimmäinen; both are in use
    replace_parts: { ensimmäinentuhannes: yhdestuhannes, ensimmäinen miljoonas: yhdes miljoonas }
    affects: 2
fr:
  - reason: the gem follows the 1990 reform by default and joins every number word with hyphens (deux-cents, cent-un); CLDR uses the traditional spaces around cent and mille
    hyphenate: [million, millions, milliard, milliards]
    affects: 23
  - reason: CLDR inserts et in 81st, 91st, 101st and 1001st (quatre-vingt-et-unième, cent-et-unième); French uses et only in 21-71 (quatre-vingt-unième, cent-unième)
    replace: { quatre-vingt-et-unième: quatre-vingt-unième, quatre-vingt-et-onzième: quatre-vingt-onzième, cent-et-unième: cent-unième, cent-et-onzième: cent-onzième, mille-et-unième: mille-unième }
    affects: 5
he:
  - reason: Hebrew joins the last element with ו (אלף ומאה); CLDR omits it
    replace: { אלף מאה: אלף ומאה }
    affects: 4
  - reason: CLDR writes שניים עשר; the compound is שנים עשר
    replace: { שניים עשר: שנים עשר }
    affects: 2
  - reason: Hebrew ordinals above ten are cardinals; the gem gives them with the definite article (העשרים), CLDR without (עשרים)
    prefix: ה
    kinds: [ordinal, ordinal/male]
    above: 10
    affects: 214
hi:
  - reason: CLDR writes पन्द्रह with a half n; the gem uses the anusvara spelling पंद्रह; both are standard
    replace_parts: { पन्द्रह: पंद्रह }
    affects: 3
  - reason: regional spelling variants of the same number (चवालीस/चौवालीस, तिरपन/तिरेपन, तिरसठ/तिरेसठ, उन्यासी/उनासी, पचानबे/पंचानबे)
    replace_parts: { चौवालीस: चवालीस, तिरेपन: तिरपन, तिरेसठ: तिरसठ, उनासी: उन्यासी, पंचानबे: पचानबे }
    affects: 15
  - reason: CLDR drops the nasalization of the feminine ordinal ending (पाँचवी); the standard ending is -वीं (पाँचवीं)
    replace_parts: { वी: वीं }
    kinds: [ordinal/female]
    affects: 113
hr:
