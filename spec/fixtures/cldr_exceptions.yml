      reason: the gem says et hundrede and et tusind; CLDR omits et, which is also usual; CLDR uses tusinde in cardinals; tusind is the usual cardinal form and tusinde the ordinal
    1100:
      gem: et tusind et hundrede
      cldr: tusinde hundredede
      reason: the gem says et hundrede and et tusind; CLDR omits et, which is also usual; CLDR uses tusinde in cardinals; tusind is the usual cardinal form and tusinde the ordinal
